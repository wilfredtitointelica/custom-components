<figure class="doc-skill-diagram" aria-label="Diagrama de cómo un componente consume los tokens del Style Guide">
	<p class="doc-skill-diagram-label">
		<i class="pi pi-palette" aria-hidden="true"></i>
		Tokens
		<code>.int-chip</code>
		<i class="pi pi-arrow-left" aria-hidden="true"></i>
		<code class="doc-is-base">--int-chip-*</code>
		<i class="pi pi-arrow-left" aria-hidden="true"></i>
		<code class="doc-is-source">--i-*</code>
		<span class="doc-skill-diagram-hint">de izquierda a derecha: cada nivel recibe del siguiente</span>
	</p>

	<div class="doc-token-flow">
		<!-- Box 1: the component (src/components/chip/). The result first, then where its values come from. -->
		<div class="doc-skill-diagram-version">
			<div class="doc-token-head">
				<p class="doc-skill-diagram-label">
					<i class="pi pi-box" aria-hidden="true"></i>
					Componente
				</p>
				<code>src/components/chip/</code>
			</div>

			<div class="doc-token-row">
				<!-- 1. Result: BEM rules only read the component aliases. -->
				<div class="doc-skill-diagram-folder">
					<p class="doc-skill-diagram-folder-name">
						<i class="pi pi-code" aria-hidden="true"></i>
						Reglas BEM
					</p>
					<p class="doc-skill-diagram-folder-text">Bloque, elementos y modificadores leen solo los alias <code>--int-chip-*</code>.</p>
<pre class="doc-token-code">.int-chip {{ '{' }}
  gap: var(--int-chip-gap);
  padding-inline: var(--int-chip-padding-x);
{{ '}' }}</pre>
					<p class="doc-skill-diagram-target">Lo que se ve en pantalla</p>
				</div>

				<p class="doc-token-arrow">
					<i class="pi pi-arrow-left" aria-hidden="true"></i>
					recibe de
				</p>

				<!-- 2. Component aliases: the adjustment point, always var(--i-*). -->
				<div class="doc-skill-diagram-folder doc-is-base">
					<p class="doc-skill-diagram-folder-name">
						<i class="pi pi-sliders-h" aria-hidden="true"></i>
						styles/_chip.scss
					</p>
					<p class="doc-skill-diagram-folder-text">Un alias por valor, siempre hacia un <code>--i-*</code>; nunca un valor fijo.</p>
<pre class="doc-token-code">:root {{ '{' }}
  --int-chip-gap: var(--i-spacing-gap-sm);
  --int-chip-padding-x: var(--i-spacing-container-lg);
{{ '}' }}</pre>
					<p class="doc-skill-diagram-target">Punto de ajuste del componente</p>
				</div>
			</div>
		</div>

		<p class="doc-token-arrow">
			<i class="pi pi-arrow-left" aria-hidden="true"></i>
			recibe de
		</p>

		<!-- Box 2: the Style Guide repo, the only source of values: its xs/sm/md aliases over the numeric scale. -->
		<div class="doc-skill-diagram-version">
			<div class="doc-token-head">
				<p class="doc-skill-diagram-label">
					<i class="pi pi-database" aria-hidden="true"></i>
					Repo Style Guide
				</p>
				<code>Intelica.Style.Guide.New</code>
			</div>

			<div class="doc-skill-diagram-folder doc-is-variants">
				<p class="doc-skill-diagram-folder-name">
					<i class="pi pi-palette" aria-hidden="true"></i>
					Primitives / Alias
				</p>
				<p class="doc-skill-diagram-folder-text">Escala xs, sm, md… de spacing, sizing, radios, tipografía, etc.</p>
<pre class="doc-token-code">:root {{ '{' }}
  --i-spacing-gap-sm: var(--i-spacing-100);
  --i-spacing-container-lg: var(--i-spacing-150);
{{ '}' }}</pre>
				<p class="doc-skill-diagram-target">_tokens.*.scss</p>
			</div>
		</div>
	</div>

	<!-- PrimeNG is only read during the analysis: its value stays as a comment. -->
	<div class="doc-skill-diagram-version doc-is-next">
		<p class="doc-skill-diagram-label">
			<i class="pi pi-book" aria-hidden="true"></i>
			<code>PrimeNG Aura</code>
			<span class="doc-skill-diagram-hint">
				solo referencia: <code>dt('chip.gap')</code> = 0.5rem queda como comentario <code>// Aura: 0.5rem</code>, nunca como valor
			</span>
		</p>
	</div>

	<p class="doc-skill-diagram-rest">los --i-* llegan en runtime con el bundle del Style Guide (localhost:8080); sin él, los int-* quedan sin tokens</p>
</figure>
