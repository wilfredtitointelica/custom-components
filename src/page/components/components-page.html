<div class="catalog">
  <button
    type="button"
    class="drawer-trigger"
    aria-controls="component-nav"
    [attr.aria-expanded]="drawerOpen()"
    (click)="drawerOpen.set(true)"
  >
    <i class="pi pi-bars" aria-hidden="true"></i>
    Browse components
  </button>

  <aside id="component-nav" class="catalog-nav" [class.is-open]="drawerOpen()" aria-label="Components">
    <div class="drawer-head">
      <span>Components</span>
      <button type="button" class="drawer-close" aria-label="Close menu" (click)="drawerOpen.set(false)">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
    <app-component-nav (navigated)="drawerOpen.set(false)" />
  </aside>

  @if (drawerOpen()) {
    <div class="scrim" aria-hidden="true" (click)="drawerOpen.set(false)"></div>
  }

  <main id="main-content" class="catalog-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
