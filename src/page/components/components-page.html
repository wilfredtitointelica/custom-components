<div class="catalog">
  <aside id="component-nav" class="drawer" [class.is-open]="drawerOpen()" aria-label="Components">
    <div class="drawer-head">
      <h2 class="drawer-title">Components</h2>
      <button type="button" class="icon-button drawer-close" aria-label="Close menu" (click)="drawerOpen.set(false)">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
    <app-component-nav (navigated)="drawerOpen.set(false)" />
  </aside>

  @if (drawerOpen()) {
    <div class="scrim" aria-hidden="true" (click)="drawerOpen.set(false)"></div>
  }

  <div class="pane">
    <header #topbar class="topbar">
      <button
        type="button"
        class="icon-button drawer-trigger"
        aria-controls="component-nav"
        aria-label="Open components menu"
        [attr.aria-expanded]="drawerOpen()"
        (click)="drawerOpen.set(true)"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <a class="topbar-brand" routerLink="/components" aria-label="Incontrol, go to start">
        <app-brand-mark />
      </a>

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li>
            <a routerLink="/components" [attr.aria-current]="component() || referencePage() ? null : 'page'">Components</a>
          </li>
          @if (referencePage(); as page) {
            <li class="breadcrumb-leaf">
              <i class="pi pi-chevron-right" aria-hidden="true"></i>
              <span aria-current="page">{{ page }}</span>
            </li>
          }
          @if (component(); as current) {
            <li>
              <i class="pi pi-chevron-right" aria-hidden="true"></i>
              <a [routerLink]="current.path" [attr.aria-current]="variant() ? null : 'page'">{{ current.name }}</a>
            </li>
          }
          @if (variant(); as selected) {
            <li class="breadcrumb-leaf">
              <i class="pi pi-chevron-right" aria-hidden="true"></i>
              <span aria-current="location">{{ selected.name }}</span>
            </li>
          }
        </ol>
      </nav>

      <app-toggle-code />
    </header>

    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
