<a class="doc-rail-brand" routerLink="/" aria-label="Incontrol, go to start">
  <app-brand-mark />
</a>

<button
  type="button"
  class="doc-rail-search"
  [class.doc-is-active]="search.isOpen()"
  [attr.aria-expanded]="search.isOpen()"
  aria-haspopup="dialog"
  (click)="search.toggle()"
>
  <span class="doc-rail-search-box"><i class="pi pi-search" aria-hidden="true"></i></span>
  <span class="doc-rail-search-label">Search</span>
</button>

<nav class="doc-rail-nav" aria-label="Main">
  @for (section of sections; track section.id) {
    <a
      class="doc-rail-item"
      [class.doc-is-pending]="section.status === 'pending'"
      [routerLink]="section.path"
      routerLinkActive="doc-is-active"
      ariaCurrentWhenActive="page"
    >
      <span class="doc-rail-indicator">
        <i class="pi {{ section.icon }}" aria-hidden="true"></i>
      </span>
      <span class="doc-rail-label">{{ section.label }}</span>
      @if (section.status === 'pending') {
        <span class="doc-rail-soon">Soon<span class="doc-visually-hidden"> (coming soon)</span></span>
      }
    </a>
  }
</nav>

<button
  type="button"
  class="doc-rail-item doc-rail-connections"
  [class]="'doc-is-' + connections.overall()"
  aria-haspopup="dialog"
  [attr.aria-label]="'Conexiones externas: ' + connectionLabels[connections.overall()]"
  [title]="'Conexiones externas: ' + connectionLabels[connections.overall()]"
  (click)="connectionsDialog.open()"
>
  <span class="doc-rail-indicator">
    <i class="pi pi-link" aria-hidden="true"></i>
    <span class="doc-rail-connections-dot" aria-hidden="true"></span>
  </span>
  <span class="doc-rail-label">Connections</span>
</button>
<app-connections-dialog #connectionsDialog />
