<!--
  title: Skeleton
  description: Con `[intSkeleton]` el acordeón mantiene las líneas de sus paneles; cada título se convierte en una barra del largo de su texto, la flecha en un bloque de su tamaño y el contenido abierto en un bloque de su alto real. Con el encabezado de estado (variant="card") cada tarjeta conserva su borde y el icono de estado se vuelve un círculo antes de la barra del título.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <int-accordion value="fees" [intSkeleton]="loading()">
    <int-accordion-panel value="fees">
      <int-accordion-header>Scheme fees</int-accordion-header>
      <int-accordion-content>Assessment, processing and cross-border fees charged by the networks.</int-accordion-content>
    </int-accordion-panel>
    <int-accordion-panel value="interchange">
      <int-accordion-header>Interchange</int-accordion-header>
      <int-accordion-content>Interchange rates paid between acquirer and issuer.</int-accordion-content>
    </int-accordion-panel>
  </int-accordion>

  <int-accordion variant="card" multiple [(value)]="active" [intSkeleton]="loading()">
    <int-accordion-panel value="sent">
      <int-accordion-header>
        <span class="int-accordion__status-icon int-accordion__status-icon--success icon icon-success" aria-hidden="true"></span>
        Alert sent: 80
      </int-accordion-header>
      <int-accordion-content>80 clients were notified about the Opt-Out deadline.</int-accordion-content>
    </int-accordion-panel>
    <int-accordion-panel value="failed">
      <int-accordion-header>
        <span class="int-accordion__status-icon int-accordion__status-icon--error icon icon-alert" aria-hidden="true"></span>
        Alert failed: 3
      </int-accordion-header>
      <int-accordion-content>3 alerts could not be delivered; check the client contact data.</int-accordion-content>
    </int-accordion-panel>
  </int-accordion>
</div>
