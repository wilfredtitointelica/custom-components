<!--
  title: Basic
  description: Un panel abierto a la vez; [(value)] guarda el value del panel activo.
-->
<int-accordion [(value)]="active">
  <int-accordion-panel value="fees">
    <int-accordion-header>Scheme fees</int-accordion-header>
    <int-accordion-content>Assessment, processing and cross-border fees charged by the networks.</int-accordion-content>
  </int-accordion-panel>
  <int-accordion-panel value="interchange">
    <int-accordion-header>Interchange</int-accordion-header>
    <int-accordion-content>Interchange rates paid between acquirer and issuer.</int-accordion-content>
  </int-accordion-panel>
</int-accordion>
