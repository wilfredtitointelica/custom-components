<!--
  title: Multiple
  description: Con multiple, value es un arreglo y se pueden abrir varios paneles a la vez.
-->
<!-- Fixed width on the accordion: the preview shrinks to its content, so the growing Value line would resize it. -->
<div class="u-display-flex u-flex-column u-gap-sm">
  <int-accordion [(value)]="active" multiple [style]="{ width: '28rem', maxWidth: '100%' }">
    @for (section of sections; track section) {
      <int-accordion-panel [value]="section">
        <int-accordion-header>{{ section }}</int-accordion-header>
        <int-accordion-content>Content for {{ section }}.</int-accordion-content>
      </int-accordion-panel>
    }
  </int-accordion>
  <p class="u-m-0 u-text-sm">Value: {{ active | json }}</p>
</div>
