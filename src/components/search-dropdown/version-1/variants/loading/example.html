<!--
  title: Loading
  description: Mientras se responde `completeMethod` el panel muestra un skeleton por defecto; `itemSkeletonCount` define cuántas filas. Para un skeleton con la forma exacta de los resultados se usa el template `itemSkeleton` (variante Template).
-->
<int-search-dropdown
  placeholder="Try &quot;serv&quot; or &quot;data&quot; (1.5 s answer)"
  ariaLabel="Search fees"
  [itemSkeletonCount]="4"
  [suggestions]="results()"
  [style]="{ width: '29rem' }"
  (completeMethod)="search($event.query)"
/>
