<!--
  title: Empty
  description: Si la búsqueda no devuelve sugerencias se muestra `emptyMessage` o el template `empty`.
-->
<int-search-dropdown
  placeholder="Type any text"
  ariaLabel="Search"
  emptyMessage="No results were found"
  [suggestions]="results()"
  [style]="{ width: '29rem' }"
  (completeMethod)="results.set([])"
/>
