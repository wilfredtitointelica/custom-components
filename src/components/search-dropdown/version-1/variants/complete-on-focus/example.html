<!--
  title: Complete On Focus
  description: Con `completeOnFocus` el panel se abre al enfocar el campo: se emite `completeMethod` aunque el texto esté vacío, para mostrar p. ej. las búsquedas recientes.
-->
<int-search-dropdown
  completeOnFocus
  placeholder="Click to see recent searches"
  ariaLabel="Search fees"
  [suggestions]="results()"
  [style]="{ width: '29rem' }"
  (completeMethod)="search($event.query)"
/>
