<!--
  title: Append To
  description: Con `appendTo="body"` el panel se monta en el `body` y se alinea debajo del campo, así un contenedor que recorta (`overflow`) o que crea su propio apilamiento no lo corta ni lo tapa. Por defecto (`self`) queda dentro del componente, encima de los elementos vecinos. También acepta un elemento: `[appendTo]="container"`.
-->
<!-- The box clips its content: with appendTo="self" the panel would be cut at its bottom edge -->
<div class="u-overflow-hidden u-p-3 u-radius-md u-bt-1 u-bm-1 u-bs-1 u-be-1">
  <int-search-dropdown
    appendTo="body"
    placeholder='Search fees, try "serv"'
    ariaLabel="Search fees"
    [suggestions]="results()"
    [style]="{ width: '29rem' }"
    (completeMethod)="search($event.query)"
  />
</div>
