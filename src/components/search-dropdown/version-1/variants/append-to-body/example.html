<!--
  title: Append To Body
  description: Con `appendTo` en `body` el panel no lo recorta ni le agrega scroll un contenedor con `overflow`; a la izquierda el mismo caso sin `appendTo`, donde el panel queda cortado. Montado fuera, su `z-index` es 1000 (el de los overlays) o el que indique `baseZIndex` (aquí `9`, debajo del encabezado fijo de la página, que está en 10) y con `autoZIndex` en `false` se define con `panelStyleClass`.
-->
<div class="u-display-flex u-flex-wrap u-gap-lg">
  <!-- Without appendTo: the panel stays inside the container and is cut at its edge -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">Sin appendTo</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <int-search-dropdown
        placeholder='Try "serv"'
        ariaLabel="Search fees"
        [suggestions]="results()"
        [style]="{ width: '20rem' }"
        (completeMethod)="search($event.query)"
      />
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <span class="u-text-sm u-color-grey-500">El panel se corta aquí</span>
    </div>
  </div>

  <!-- appendTo="body": the panel lives in the body, so it is not cut -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">appendTo="body"</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <int-search-dropdown
        appendTo="body"
        [baseZIndex]="9"
        placeholder='Try "serv"'
        ariaLabel="Search fees"
        [suggestions]="results()"
        [style]="{ width: '20rem' }"
        (completeMethod)="search($event.query)"
      />
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <span class="u-text-sm u-color-grey-500">El panel pasa por encima del borde</span>
    </div>
  </div>
</div>
