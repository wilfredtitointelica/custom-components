<!--
  title: Wizard
  description: Modo wizard de la base de conocimientos: los pasos llevan `disabled` y solo se avanza con Continue o se retrocede con Back (deshabilitado en el primer paso). Back y Continue llevan íconos de flecha.
-->
<int-stepper variant="progressive" [value]="step()">
  <int-step-list>
    <int-step [value]="1" disabled>Review</int-step>
    <int-step [value]="2" disabled>Action</int-step>
    <int-step [value]="3" disabled>Confirm</int-step>
  </int-step-list>
  <int-step-panels>
    @for (panel of panels; track panel.value; let first = $first; let last = $last) {
      <int-step-panel [value]="panel.value">
        <div class="u-display-flex u-flex-column u-align-items-center u-gap-lg">
          <i class="icon u-text-5xl {{ panel.icon }}" aria-hidden="true"></i>
          <div class="u-display-flex u-flex-column u-align-items-center">
            <span class="u-text-xl u-bold u-text-center u-display-block">{{ panel.title }}</span>
            <span class="u-text-lg u-text-center u-display-block">{{ panel.subtitle }}</span>
          </div>
        </div>
        <div class="u-display-flex u-align-items-center u-justify-content-between">
          <button intButton severity="secondary" label="Back" icon="icon icon-arrow-left" [disabled]="first" (click)="prevStep()"></button>
          <button intButton label="Continue" icon="icon icon-arrow-right" iconPos="right" [disabled]="last" (click)="nextStep()"></button>
        </div>
      </int-step-panel>
    }
  </int-step-panels>
</int-stepper>
