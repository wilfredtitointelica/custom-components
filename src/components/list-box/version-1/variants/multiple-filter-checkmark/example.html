<!--
  title: Multiple, filter & checkmark
  description: multiple guarda un arreglo; filter ignora mayúsculas y tildes; checkmark marca las seleccionadas. Diners Club está deshabilitado con optionDisabled.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <int-list-box
    [options]="brands"
    optionLabel="name"
    optionValue="code"
    optionDisabled="inactive"
    [(ngModel)]="selected"
    multiple
    filter
    checkmark
    ariaLabel="Brands"
  />
  <p class="u-m-0 u-text-sm">Value: {{ selected.join(', ') || '—' }}</p>
</div>
