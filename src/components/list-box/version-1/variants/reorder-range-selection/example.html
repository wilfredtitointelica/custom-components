<!--
  title: Reorder & range selection
  description: Con `dragdrop` las opciones se reordenan arrastrándolas (`onDrop`). Con `multiple` y `metaKeySelection`, un clic elige solo esa opción, Ctrl o ⌘ + clic suma o quita, y Shift + clic o Shift + flechas eligen un rango. Doble clic emite `onDblClick`.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <int-list-box
    multiple
    metaKeySelection
    dragdrop
    ariaLabel="Report columns"
    [options]="columns"
    [(ngModel)]="selected"
    (onDblClick)="last.set('Double click: ' + $event.value)"
    (onDrop)="last.set('Order: ' + columns.join(', '))"
  />
  <p class="u-m-0 u-text-sm">Selected: {{ selected.join(', ') || '—' }}</p>
  <p class="u-m-0 u-text-sm">{{ last() }}</p>
</div>
