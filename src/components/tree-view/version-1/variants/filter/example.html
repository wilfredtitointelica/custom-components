<!--
  title: Filter
  description: Con `filter` aparece un buscador arriba del árbol que compara el campo de `filterBy` (por defecto `label`) y abre los padres de los resultados. En `filterMode` `lenient` (por defecto) un padre que coincide muestra todos sus hijos; en `strict` solo los que coinciden.
-->
<div class="u-display-flex u-flex-wrap u-gap-xl">
  <int-tree-view [value]="lenientNodes" filter filterPlaceholder="Lenient filter" ariaLabel="Lenient filter" [style]="{ width: '18rem' }" />
  <int-tree-view [value]="strictNodes" filter filterMode="strict" filterPlaceholder="Strict filter" ariaLabel="Strict filter" [style]="{ width: '18rem' }" />
</div>
