<!--
  title: Controlled
  description: El estado expandido se controla desde fuera con la propiedad `expanded` de los nodos: Expand all y Collapse all.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div class="u-display-flex u-gap-sm">
    <int-button label="Expand all" (onClick)="expandAll()" />
    <int-button label="Collapse all" (onClick)="collapseAll()" />
  </div>
  <int-tree-view [value]="nodes()" [(selection)]="selected" ariaLabel="Files" />
</div>
