<!--
  title: Size
  description: `size="small"` es la tabla compacta del proyecto: cabecera y filas más bajas.
-->
<div class="u-display-flex u-flex-column u-gap-xl">
  @for (size of sizes; track size.label) {
    <div class="u-display-flex u-flex-column u-gap-sm">
      <span class="u-text-sm u-bold">{{ size.label }}</span>
      <int-table [style]="{ width: '40rem' }" [value]="fees" [size]="size.value">
        <ng-template #header>
          <tr>
            <th class="u-text-left"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Fee Name</div></th>
            <th><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Fee Code</div></th>
            <th class="u-text-right"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Amount USD</div></th>
          </tr>
        </ng-template>
        <ng-template #body let-fee>
          <tr>
            <td class="u-text-left">{{ fee.name }}</td>
            <td class="u-text-center">{{ fee.code }}</td>
            <td class="u-text-right">{{ fee.amount }}</td>
          </tr>
        </ng-template>
      </int-table>
    </div>
  }
</div>
