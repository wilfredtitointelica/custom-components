<!--
  title: Sort
  description: Cada cabecera con `intSortableColumn` ordena la tabla por su campo con clic, Enter o Space; `int-sort-icon` muestra el sentido. `sortField` y `sortOrder` fijan el orden inicial.
-->
<int-table [style]="{ width: '40rem' }" [value]="fees" sortField="amount" [sortOrder]="-1">
  <ng-template #header>
    <tr>
      <th class="u-text-left" intSortableColumn="name">
        <div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Fee Name <int-sort-icon field="name" /></div>
      </th>
      <th intSortableColumn="code">
        <div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">
          Fee Code <int-sort-icon field="code" />
        </div>
      </th>
      <th intSortableColumn="date">
        <div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">
          Effective Date <int-sort-icon field="date" />
        </div>
      </th>
      <th class="u-text-right" intSortableColumn="amount">
        <div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">
          Amount USD <int-sort-icon field="amount" />
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-fee>
    <tr>
      <td class="u-text-left">{{ fee.name }}</td>
      <td class="u-text-center">{{ fee.code }}</td>
      <td class="u-text-center">{{ fee.date | date: 'dd MMM, y' }}</td>
      <td class="u-text-right">{{ fee.amount | number: '1.2-2' }}</td>
    </tr>
  </ng-template>
</int-table>
