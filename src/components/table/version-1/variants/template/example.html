<!--
  title: Template
  description: El template `caption` va arriba de la tabla con el buscador y la exportación alineados a la derecha; `emptymessage` es la fila que se muestra cuando no hay datos.
-->
<div class="u-display-flex u-flex-column u-gap-xl">
  <int-table [style]="{ width: '40rem' }" [value]="fees">
    <ng-template #caption>
      <div class="u-display-flex u-align-items-center u-justify-content-end u-gap-sm u-full-width u-pb-2">
        <!-- dep:search provisional · replace with <int-search> when search is done -->
        <input
          type="text"
          class="u-px-2 u-py-1 u-radius-lg u-background-white u-text-md"
          data-dep="search"
          placeholder="Search text here"
          aria-label="Search"
          [value]="searchText()"
          (input)="searchText.set($any($event.target).value)"
        />
        <!-- /dep:search -->
        <!-- dep:dropdown-select provisional · replace with <int-dropdown-select> when dropdown-select is done -->
        <button
          type="button"
          class="u-display-flex u-align-items-center u-gap-xs u-px-2 u-py-1 u-radius-lg u-background-white u-text-md u-pointer"
          data-dep="dropdown-select"
        >
          Export <i class="icon icon-arrow-down icon--xs" aria-hidden="true"></i>
        </button>
        <!-- /dep:dropdown-select -->
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th class="u-text-left"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Fee Name</div></th>
        <th><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Region</div></th>
        <th class="u-text-right"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Amount USD</div></th>
      </tr>
    </ng-template>
    <ng-template #body let-fee>
      <tr>
        <td class="u-text-left">{{ fee.name }}</td>
        <td class="u-text-center">{{ fee.region }}</td>
        <td class="u-text-right">{{ fee.amount | number: '1.2-2' }}</td>
      </tr>
    </ng-template>
  </int-table>

  <int-table [style]="{ width: '40rem' }" [value]="[]">
    <ng-template #header>
      <tr>
        <th class="u-text-left"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Fee Name</div></th>
        <th><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Region</div></th>
        <th class="u-text-right"><div class="u-display-flex u-align-items-center u-justify-content-center u-gap-sm">Amount USD</div></th>
      </tr>
    </ng-template>
    <ng-template #body let-fee>
      <tr>
        <td class="u-text-left">{{ fee.name }}</td>
        <td class="u-text-center">{{ fee.region }}</td>
        <td class="u-text-right">{{ fee.amount }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td class="u-text-center" colspan="3">No fees found.</td>
      </tr>
    </ng-template>
  </int-table>
</div>
