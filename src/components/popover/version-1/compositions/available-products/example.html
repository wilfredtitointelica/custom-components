<!--
  title: Available Products
  description: Menú de productos del header: popover anclado a la pestaña Products, con título y una lista de productos (icono, nombre, `int-tag` New / Legacy y descripción); el producto actual queda resaltado.
-->
<div class="u-display-flex u-flex-column u-align-items-center">
  <button intButton variant="text" label="Products" (click)="op.toggle($event)"></button>
  <int-popover #op ariaLabel="Available Products">
    <div class="u-display-flex u-flex-column u-gap-lg">
      <h2 class="u-m-0">Available Products</h2>
      <ul class="u-display-flex u-flex-column u-gap-sm u-m-0 u-p-0">
        @for (product of products; track product.name) {
          <li>
            <button
              type="button"
              class="u-display-flex u-flex-column u-gap-xs u-full-width u-p-3 u-radius-lg u-pointer"
              [attr.aria-current]="product.name === current() || null"
              (click)="current.set(product.name); op.hide()"
            >
              <span class="u-display-flex u-align-items-center u-gap-sm">
                <span class="icon" [class]="product.icon" aria-hidden="true"></span>
                <span class="u-text-xl u-bold">{{ product.name }}</span>
                <int-tag rounded [severity]="product.legacy ? 'secondary' : null" [value]="product.legacy ? 'Legacy' : 'New'" />
              </span>
              <span class="u-text-md">{{ product.description }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  </int-popover>
  <p class="u-m-0 u-text-sm">Current: {{ current() }}</p>
</div>
