<!--
  title: Popover
  description: Contenedor flotante anclado a su disparador, que se abre por código con toggle, show y hide. Se cierra al hacer clic fuera o con Escape y devuelve el foco al disparador.
  figma:
  -->
<ng-template #panel>
  <div
    class="int-popover"
    role="dialog"
    tabindex="-1"
    [id]="id"
    [class]="styleClass() ?? ''"
    [attr.aria-label]="ariaLabel() ?? null"
  >
    <ng-content />
  </div>
</ng-template>
