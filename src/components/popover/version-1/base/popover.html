<!--
  title: Popover
  description: Contenedor flotante anclado a su disparador, que se abre por código con toggle, show y hide. Se cierra al hacer clic fuera o con Escape y devuelve el foco al disparador.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=2238-287&m=dev
-->
<ng-template #panel>
  <div
    class="int-popover"
    role="dialog"
    tabindex="-1"
    [id]="id"
    [class]="styleClass() ?? ''"
    [class.int-popover--arrow]="arrow()"
    [class.int-popover--borderless]="borderless()"
    [class.int-popover--flipped]="arrow() && flipped()"
    [style.--int-popover-arrow-left.px]="arrow() ? arrowLeft() : null"
    [attr.aria-label]="ariaLabel() ?? null"
  >
    <!-- Scrolls when the CDK limits the panel to the space left in the viewport; the arrow stays outside. -->
    <div class="int-popover__content">
      <ng-content />
    </div>
  </div>
</ng-template>
