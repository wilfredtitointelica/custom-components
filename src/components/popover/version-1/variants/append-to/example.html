<!--
  title: Append To
  description: El panel se monta dentro del componente por defecto (`appendTo="self"`) y se coloca sobre la pantalla. Con `appendTo="body"` o un elemento se monta ahí, y `baseZIndex` fija su `z-index` (aquí `9`, debajo del encabezado fijo de la página, que está en 10).
-->
<div #container class="u-display-flex u-flex-column u-align-items-center u-gap-md u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
  <button intButton type="button" label="Show info" (click)="op.toggle($event)"></button>
  <span class="u-text-sm u-color-grey-500">Panel montado en este contenedor</span>
  <int-popover #op [appendTo]="container" [baseZIndex]="9" ariaLabel="Info">
    <p class="u-m-0 u-text-sm">Mounted inside the container.</p>
  </int-popover>
</div>
