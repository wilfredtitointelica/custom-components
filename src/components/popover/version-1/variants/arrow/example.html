<!--
  title: Arrow
  description: Con arrow el popover muestra una flecha sólida, como la del tooltip, que apunta al centro del disparador. Si se abre encima del disparador, la flecha pasa al borde inferior.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <button intButton icon="icon icon-info" ariaLabel="More info" variant="text" (click)="info.toggle($event)"></button>
  <int-popover #info arrow ariaLabel="Fee information">
    <div class="u-display-flex u-flex-column u-gap-xs">
      <span class="u-bold">Cross-border fee</span>
      <p class="u-m-0 u-text-sm">Charged when the issuer and the acquirer are in different countries.</p>
    </div>
  </int-popover>

  <button intButton label="Show applied filters" severity="secondary" (click)="filters.toggle($event)"></button>
  <int-popover #filters arrow ariaLabel="Applied filters">
    <p class="u-m-0 u-text-sm">Brand: Visa · Region: LAC · Period: Q3 2026</p>
  </int-popover>
</div>
