<!--
  title: Append To Body
  description: Con `appendTo` en `body` el panel no lo recorta ni le agrega scroll un contenedor con `overflow`, y sigue al botón cuando la página hace scroll; a la izquierda el mismo caso sin `appendTo` (`self`), donde el panel queda cortado. `appendTo` también acepta un elemento (`[appendTo]="container"`). Montado fuera, su `z-index` es 1000 (el de los overlays) o el que indique `baseZIndex` (aquí `9`, debajo del encabezado fijo de la página, que está en 10).
-->
<div class="u-display-flex u-flex-wrap u-gap-lg">
  <!-- Without appendTo: the panel stays inside the container and is cut at its edge -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">Sin appendTo</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <div><button intButton type="button" label="Show info" (click)="clipped.toggle($event)"></button></div>
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <span class="u-text-sm u-color-grey-500">El panel se corta aquí</span>
      <int-popover #clipped ariaLabel="Info">
        <p class="u-m-0 u-text-sm">Payment brands are grouped by network and settlement currency.</p>
      </int-popover>
    </div>
  </div>

  <!-- appendTo="body": the panel lives in the body, so it is not cut -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">appendTo="body"</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <div><button intButton type="button" label="Show info" (click)="op.toggle($event)"></button></div>
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <span class="u-text-sm u-color-grey-500">El panel pasa por encima del borde</span>
      <int-popover #op appendTo="body" [baseZIndex]="9" ariaLabel="Info">
        <p class="u-m-0 u-text-sm">Payment brands are grouped by network and settlement currency.</p>
      </int-popover>
    </div>
  </div>
</div>
