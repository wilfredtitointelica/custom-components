<!--
  title: Tooltip
  description: Directiva intTooltip. Se muestra con hover y con foco de teclado (tooltipEvent="both"), queda enlazada con aria-describedby y Escape la oculta.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=2238-340&m=dev
-->
@if (template(); as tpl) {
  <ng-container [ngTemplateOutlet]="tpl" />
} @else {
  {{ content() }}
}
