<!--
  title: Template content & delay
  description: intTooltip acepta un ng-template para contenido enriquecido; showDelay retrasa la aparición.
-->
<int-pill value="Rate" severity="info" tabindex="0" [intTooltip]="rateTpl" [showDelay]="300" />
<ng-template #rateTpl>
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-bold">Rate breakdown</span>
    <span>0.80% + USD 0.10 per transaction</span>
  </div>
</ng-template>
