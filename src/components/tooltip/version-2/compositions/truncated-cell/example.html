<!--
  title: Truncated cell
  description: Patrón de tabla: con `tooltipOnTruncate` (extensión int-*) el tooltip solo aparece cuando el texto está cortado con puntos suspensivos; el valor corto de abajo no lo muestra.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <span tabindex="0" tooltipOnTruncate [intTooltip]="fee">{{ fee }}</span>
  <span tabindex="0" tooltipOnTruncate [intTooltip]="shortFee">{{ shortFee }}</span>
</div>
