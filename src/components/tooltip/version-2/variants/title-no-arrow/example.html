<!--
  title: Title & no arrow
  description: tooltipTitle agrega un título en negrita sobre el texto; tooltipArrow=false oculta la flecha (Indicator=None).
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <button intButton severity="secondary" label="With title" intTooltip="Write here the text of the description and to help the user to understand more information" tooltipTitle="Title here"></button>
  <button intButton severity="secondary" label="No arrow" intTooltip="Write here the text of the description and to help the user to understand more information" tooltipTitle="Title here" [tooltipArrow]="false"></button>
</div>
