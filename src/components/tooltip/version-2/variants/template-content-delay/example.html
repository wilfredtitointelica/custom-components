<!--
  title: Template content & delay
  description: intTooltip acepta un ng-template para contenido enriquecido; showDelay retrasa la aparición.
-->
<int-pill value="Rate" severity="info" tabindex="0" tooltipTitle="Rate breakdown" [intTooltip]="rateTpl" [showDelay]="300" />
<ng-template #rateTpl>
  <span>0.80% + USD 0.10 per transaction</span>
</ng-template>
