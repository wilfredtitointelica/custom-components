<!--
  title: Basic mode & auto
  description: mode="basic" muestra solo el botón; con auto, uploadHandler se emite apenas se elige un archivo válido.
-->
<int-file-upload
  mode="basic"
  accept=".pdf"
  auto
  chooseLabel="Attach PDF"
  chooseIcon="icon icon-attachment"
  (uploadHandler)="upload($event)"
/>
<p>Uploaded: {{ uploaded().join(', ') || '—' }}</p>
