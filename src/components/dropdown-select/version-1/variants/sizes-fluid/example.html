<!--
  title: Sizes & fluid
  description: size="small" | "large" y fluid para ocupar todo el ancho.
-->
<!-- The preview shrinks to its content: the sizes row sets the width that the fluid select fills. -->
<div class="u-display-flex u-flex-column u-gap-sm">
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <int-dropdown-select [options]="regions" optionLabel="name" size="small" placeholder="Small" ariaLabel="Small" />
    <int-dropdown-select [options]="regions" optionLabel="name" size="large" placeholder="Large" ariaLabel="Large" />
  </div>
  <int-dropdown-select [options]="regions" optionLabel="name" fluid placeholder="Fluid" ariaLabel="Fluid" />
</div>
