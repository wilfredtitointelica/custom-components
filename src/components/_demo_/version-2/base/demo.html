<!--
  title: Demo
  description: Implementación de referencia de todo el flujo: config, base, variantes, composiciones y estilos.
  description-api: Opcional. Sin esta línea, el tab API muestra un texto genérico; aquí se reemplaza por uno propio.
  description-compositions: Opcional. Casos de uso armados con la API de Demo y los helpers `u-*`.
  figma: https://www.figma.com/design/FILE_KEY/Intelica-Components?node-id=0-1
-->
<header class="int-demo__header">
  <i class="int-demo__icon icon {{ icon() }}" aria-hidden="true"></i>
  <h3 class="int-demo__title">{{ title() }}</h3>
  <span class="int-demo__count">{{ items().length }}</span>
</header>
<ul class="int-demo__list">
  @for (item of items(); track item) {
    <li class="int-demo__item">{{ item }}</li>
  }
</ul>
