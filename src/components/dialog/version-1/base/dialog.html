<!--
  title: Dialog (Modal)
  description: Dialog muestra contenido en una ventana modal sobre la página.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=2354-3101&m=dev
-->
<ng-template #dialog>
  <div
    class="int-dialog"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="focusOnShow()"
    [class]="panelClass()"
    [ngStyle]="style()"
    [attr.role]="role()"
    [attr.aria-modal]="modal()"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-describedby]="ariaDescribedBy() ?? null"
  >
    @if (showHeader()) {
      <div class="int-dialog__header">
        <div class="int-dialog__title" [id]="headerId">
          @if (headerTemplate(); as tpl) {
            <ng-container [ngTemplateOutlet]="tpl" />
          } @else {
            {{ header() }}
          }
        </div>
        @if (closable()) {
          <!-- Figma icon-button: the bare text + icon-only int-button (24px box, 16px icon). -->
          <button
            intButton
            type="button"
            class="int-dialog__close"
            variant="text"
            icon="icon icon-cancel"
            [ariaLabel]="config.t('close')"
            (click)="close()"
          ></button>
        }
      </div>
    }
    <div class="int-dialog__content">
      <ng-content />
    </div>
    @if (footerTemplate(); as tpl) {
      <div class="int-dialog__footer">
        <ng-container [ngTemplateOutlet]="tpl" />
      </div>
    }
  </div>
</ng-template>
