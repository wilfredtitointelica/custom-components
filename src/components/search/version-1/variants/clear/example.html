<!--
  title: Clear
  description: Con `showClear` (extensión `int-*`) aparecen la ✕ y el separador antes de la lupa cuando el campo tiene texto; al pulsarla vacía el valor, emite `onClear` y devuelve el foco al campo.
-->
<int-search [(ngModel)]="value" placeholder="Search" ariaLabel="Search" showClear [style]="{ width: '15rem' }" />
