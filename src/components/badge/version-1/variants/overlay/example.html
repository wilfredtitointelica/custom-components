<!--
  title: Overlay
  description: `int-overlay-badge` posiciona el badge sobre la esquina superior derecha de su contenido, con los mismos inputs `value`, `severity` y `badgeSize`. Sin `value` se muestra como punto.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-xl">
  <int-overlay-badge value="2">
    <i class="icon icon-notification icon--lg" aria-hidden="true"></i>
  </int-overlay-badge>
  <int-overlay-badge severity="danger" value="4">
    <i class="icon icon-calendar icon--lg" aria-hidden="true"></i>
  </int-overlay-badge>
  <int-overlay-badge severity="danger">
    <i class="icon icon-mail icon--lg" aria-hidden="true"></i>
  </int-overlay-badge>
</div>
