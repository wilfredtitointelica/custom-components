<!--
  title: Notification
  description: Botón de notificaciones con un contador: `int-overlay-badge` con `severity` `danger` sobre un botón de icono; sin `value` queda como punto.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-xl">
  <int-overlay-badge severity="danger" value="3">
    <button intButton severity="secondary" icon="icon icon-notification" ariaLabel="Notifications, 3 unread"></button>
  </int-overlay-badge>
  <int-overlay-badge severity="danger">
    <button intButton severity="secondary" icon="icon icon-notification" ariaLabel="New notifications"></button>
  </int-overlay-badge>
</div>
