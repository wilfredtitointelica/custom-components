<!--
  title: Notification
  description: Botón de notificaciones con un contador: `int-overlay-badge` con `severity` `danger` sobre un botón de icono; sin `value` queda como punto.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-xl">
  <int-overlay-badge severity="danger" value="3">
    <!-- dep:button provisional · replace with <int-button severity="secondary"> (icon only) when button is done -->
    <button type="button" class="u-display-flex u-align-items-center u-justify-content-center u-p-1 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-color-primary u-pointer" aria-label="Notifications, 3 unread" data-dep="button">
      <i class="icon icon-notification icon--md" aria-hidden="true"></i>
    </button>
    <!-- /dep:button -->
  </int-overlay-badge>
  <int-overlay-badge severity="danger">
    <!-- dep:button provisional · replace with <int-button severity="secondary"> (icon only) when button is done -->
    <button type="button" class="u-display-flex u-align-items-center u-justify-content-center u-p-1 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-color-primary u-pointer" aria-label="New notifications" data-dep="button">
      <i class="icon icon-notification icon--md" aria-hidden="true"></i>
    </button>
    <!-- /dep:button -->
  </int-overlay-badge>
</div>
