<!--
  title: Sticky Header
  description: `stickyHeader` deja la cabecera fija al desplazar la página y `stickyTop` define a qué distancia de arriba se pega: la suma de lo que ya está fijo encima en cada dashboard (header, filtros, tabs). Sin `stickyTop`, se pega bajo el header del dashboard (`--i-dashboard-layout-header-height`).
-->
<!-- In this page, what is fixed above the preview: top bar + chips row + variant title -->
<int-treetable
  stickyHeader
  stickyTop="calc(var(--doc-topbar-h) + var(--doc-meta-h) + var(--doc-section-head-h))"
  [value]="files"
>
  <ng-template #header>
    <tr>
      <th class="u-text-left" width="50%">Name</th>
      <th width="25%">Size</th>
      <th width="25%">Type</th>
    </tr>
  </ng-template>
  <ng-template #body let-rowNode let-rowData="rowData">
    <tr [ttRow]="rowNode">
      <td class="u-text-left">
        <div class="u-display-flex u-align-items-center u-gap-xs">
          <int-treetable-toggler [rowNode]="rowNode" />
          <span class="u-text-ellipsis">{{ rowData.name }}</span>
        </div>
      </td>
      <td class="u-text-center">{{ rowData.size }} kb</td>
      <td class="u-text-center">{{ rowData.type }}</td>
    </tr>
  </ng-template>
</int-treetable>
