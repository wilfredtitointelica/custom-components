<!--
  title: Filter
  description: Filtro global con `filterGlobal()` y `globalFilterFields`; `filterMode` decide si se conservan los padres (`lenient`) o solo las ramas que coinciden (`strict`).
-->
<int-treetable #tt filterMode="lenient" [value]="files" [globalFilterFields]="['name', 'type']">
  <ng-template #caption>
    <div class="u-display-flex u-justify-content-end u-full-width">
      <!-- dep:input provisional · replace with <int-input> when input is done -->
      <input
        #search
        type="text"
        class="u-px-3 u-py-2 u-radius-md u-bt-1 u-bm-1 u-bs-1 u-be-1 u-background-white u-text-sm"
        placeholder="Search"
        aria-label="Search"
        data-dep="input"
        (input)="tt.filterGlobal(search.value, 'contains')"
      />
      <!-- /dep:input -->
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="u-text-left" width="50%">Name</th>
      <th width="25%">Size</th>
      <th width="25%">Type</th>
    </tr>
  </ng-template>
  <ng-template #body let-rowNode let-rowData="rowData">
    <tr [ttRow]="rowNode">
      <td class="u-text-left">
        <div class="u-display-flex u-align-items-center u-gap-xs">
          <int-treetable-toggler [rowNode]="rowNode" />
          <span class="u-text-ellipsis">{{ rowData.name }}</span>
        </div>
      </td>
      <td class="u-text-center">{{ rowData.size }} kb</td>
      <td class="u-text-center">{{ rowData.type }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3" class="u-text-center">No files found.</td>
    </tr>
  </ng-template>
</int-treetable>
