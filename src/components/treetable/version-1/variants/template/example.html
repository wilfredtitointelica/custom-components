<!--
  title: Template
  description: Los templates `caption`, `summary` y `footer` agregan una cabecera, un resumen y un pie de tabla.
-->
<int-treetable [value]="files">
  <ng-template #caption>
    <div class="u-display-flex u-align-items-center u-justify-content-between u-full-width">
      <span class="u-text-md u-bold">File Viewer</span>
      <span class="u-text-sm u-color-grey-500">Root folders: {{ files.length }}</span>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th class="u-text-left" width="50%">Name</th>
      <th width="25%">Size</th>
      <th width="25%">Type</th>
    </tr>
  </ng-template>
  <ng-template #body let-rowNode let-rowData="rowData">
    <tr [ttRow]="rowNode">
      <td class="u-text-left">
        <div class="u-display-flex u-align-items-center u-gap-xs">
          <int-treetable-toggler [rowNode]="rowNode" />
          <span class="u-text-ellipsis">{{ rowData.name }}</span>
        </div>
      </td>
      <td class="u-text-center">{{ rowData.size }} kb</td>
      <td class="u-text-center">{{ rowData.type }}</td>
    </tr>
  </ng-template>
  <ng-template #footer>
    <tr>
      <td class="u-text-left">Total</td>
      <td class="u-text-center">195 kb</td>
      <td></td>
    </tr>
  </ng-template>
  <ng-template #summary>
    <span class="u-text-sm">Sizes are shown in kilobytes.</span>
  </ng-template>
</int-treetable>
