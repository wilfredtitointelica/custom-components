<!--
  title: Checkbox Selection
  description: Con `selectionMode="checkbox"`, `int-treetable-checkbox` e `int-treetable-header-checkbox` la marca se propaga a hijos y padres en `[(selectionKeys)]`.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <int-treetable selectionMode="checkbox" dataKey="key" [value]="files" [(selectionKeys)]="selectionKeys">
    <ng-template #header>
      <tr>
        <th class="u-text-left" width="50%">
          <span class="u-display-inline-flex u-align-items-center u-gap-sm u-inherit-width">
            <int-treetable-header-checkbox />
            Name
          </span>
        </th>
        <th width="25%">Size</th>
        <th width="25%">Type</th>
      </tr>
    </ng-template>
    <ng-template #body let-rowNode let-rowData="rowData">
      <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode">
        <td class="u-text-left">
          <div class="u-display-flex u-align-items-center u-gap-xs">
            <int-treetable-toggler [rowNode]="rowNode" />
            <int-treetable-checkbox [value]="rowNode" />
            <span class="u-text-ellipsis">{{ rowData.name }}</span>
          </div>
        </td>
        <td class="u-text-center">{{ rowData.size }} kb</td>
        <td class="u-text-center">{{ rowData.type }}</td>
      </tr>
    </ng-template>
  </int-treetable>
  <p class="u-m-0 u-text-sm">Checked nodes: {{ checkedCount() }}</p>
</div>
