<!--
  title: Usage Metric
  description: Fila de productos, cada uno con su código, un icono de información con tooltip, el monto con su moneda y una métrica de uso: el porcentaje a la izquierda de una barra fina sin etiqueta (`showValue` en `false`) y un texto de estado debajo. Todo el contenido va con helpers `u-*`; el tooltip es provisional hasta que `int-tooltip` esté listo.
-->
<div class="u-display-flex u-flex-wrap u-gap-2xl">
	@for (product of products; track product.code) {
	<div class="u-display-flex u-flex-column u-gap-md">
		<!-- Code and amount -->
		<div class="u-display-flex u-flex-column u-gap-sm">
			<div class="u-display-flex u-align-items-center u-gap-xs">
				<span class="u-text-sm u-bold u-color-body u-text-nowrap">{{ product.code }}</span>
				<ng-container *ngTemplateOutlet="info; context: { $implicit: product }" />
			</div>
			<div class="u-display-flex u-color-body">
				<span class="u-text-sm u-bold u-text-lineHeight-cap">{{ product.currency }}</span>
				<span class="u-text-3xl u-bold u-text-lineHeight-cap u-text-nowrap">{{ product.amount }}</span>
			</div>
		</div>

		<!-- Usage metric -->
		<div class="u-display-flex u-flex-column u-gap-xs">
			<div class="u-display-flex u-align-items-center u-gap-xs u-text-sm u-color-body">
				<i class="icon icon-bank icon--sm" aria-hidden="true"></i>
				<span [id]="labelId(product)">{{ product.metric }}</span>
			</div>
			<div class="u-display-flex u-align-items-center u-gap-xs">
				<span class="u-text-sm u-color-body u-text-nowrap u-text-lineHeight-cap">{{ product.value }}%</span>
				<int-progressbar [ariaLabelledBy]="labelId(product)" [value]="product.value" [showValue]="false" [style]="{ width: '13rem', height: '1rem' }" />
			</div>
			<span class="u-text-sm u-text-lineHeight-tight u-color-trend-positive">{{ product.status }}</span>
		</div>
	</div>
	}
</div>

<!-- Info icon with its tooltip (knowledgeBase tooltip.md: <span> trigger wrapping an icon--sm, position top). -->
<ng-template #info let-product>
	<!-- dep:tooltip provisional · replace with <int-tooltip> when tooltip is done -->
	<span
		class="u-relative u-display-inline-flex u-flex-column u-align-items-center"
		tabindex="0"
		[attr.aria-describedby]="tooltipId(product)"
		data-dep="tooltip"
		(mouseenter)="open.set(tooltipId(product))"
		(mouseleave)="open.set(null)"
		(focus)="open.set(tooltipId(product))"
		(blur)="open.set(null)"
	>
		<!-- Zero-size anchor: its end-justified column puts the tooltip right above the icon. -->
		<span class="u-display-flex u-flex-column u-justify-content-end u-align-items-center">
			@if (open() === tooltipId(product)) {
			<span class="u-absolute u-mb-1 u-p-3 u-radius-sm u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-shadow-sm u-text-xs u-color-primary u-text-nowrap" role="tooltip" [id]="tooltipId(product)">
				{{ product.description }}
			</span>
			}
		</span>
		<i class="icon icon--xs icon-info" aria-hidden="true"></i>
	</span>
	<!-- /dep:tooltip -->
</ng-template>
