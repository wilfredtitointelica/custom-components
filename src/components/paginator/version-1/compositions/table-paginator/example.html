<!--
  title: Table paginator
  description: Paginador al pie de una tabla, alineado a la derecha sobre fondo claro: en `templateLeft` el selector de filas por página y el campo "Page n of N", y después las flechas `previous` y `next` con `icon-arrow-*`. Se arma con `showPageLinks`, `showFirstLastIcon` y `showCurrentPageReport` en `false`.
-->

<!-- Table paginator: closes the panel of the table, aligned to the end on a light bar -->
<div class="u-display-flex u-justify-content-end u-px-3 u-py-3 u-background-white">
	<int-paginator
		[showJumpToPageInput]="false"
		[showCurrentPageReport]="false"
		[showPageLinks]="false"
		[showFirstLastIcon]="false"
		[totalRecords]="totalRecords"
		[rows]="rowsPerPage()"
		[first]="(currentPage() - 1) * rowsPerPage()"
		[templateLeft]="tableTemplateLeft"
		(onPageChange)="onPageChange($event)"
	>
		<ng-template #previouspagelinkicon><i class="icon icon-arrow-left icon--sm" aria-hidden="true"></i></ng-template>
		<ng-template #nextpagelinkicon><i class="icon icon-arrow-right icon--sm" aria-hidden="true"></i></ng-template>
	</int-paginator>
</div>

<!-- Rows per page and page number: inside templateLeft, not the built-in controls -->
<ng-template #tableTemplateLeft>
	<div class="u-display-flex u-align-items-center u-gap-lg u-text-md">
		<!-- Rows per page -->
		<div class="u-display-flex u-align-items-center u-gap-lg">
			<span class="u-text-nowrap" id="table-paginator-rows-label">Rows per page:</span>

			<!-- dep:dropdown-select provisional · replace with <int-dropdown-select> when dropdown-select is done -->
			<span class="u-relative u-display-inline-flex u-flex-column u-align-items-center" data-dep="dropdown-select">
				<!-- Empty anchor (0 height): the list grows upwards from it, centered on the trigger -->
				<span class="u-display-flex u-flex-column u-justify-content-end u-align-items-center">
					@if (rowsOpen()) {
					<div
						class="u-absolute u-mb-1 u-px-1 u-py-1 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-shadow-md u-text-right"
						role="listbox"
						id="table-paginator-rows-list"
						aria-labelledby="table-paginator-rows-label"
					>
						@for (size of otherPageSizes(); track size) {
						<div
							class="u-px-1 u-pointer"
							role="option"
							tabindex="0"
							[attr.aria-selected]="false"
							(click)="selectRowsPerPage(size, trigger)"
							(keydown.enter)="selectRowsPerPage(size, trigger)"
							(keydown.space)="$event.preventDefault(); selectRowsPerPage(size, trigger)"
							(keydown.escape)="closeRows(trigger)"
						>
							{{ size }}
						</div>
						}
					</div>
					}
				</span>
				<span
					#trigger
					class="u-display-flex u-align-items-center u-gap-sm u-pointer"
					role="combobox"
					tabindex="0"
					aria-haspopup="listbox"
					aria-controls="table-paginator-rows-list"
					aria-labelledby="table-paginator-rows-label"
					[attr.aria-expanded]="rowsOpen()"
					(click)="toggleRows()"
					(keydown)="onRowsTriggerKeydown($event)"
				>
					<span class="u-text-right">{{ rowsPerPage() }}</span>
					<i class="icon icon--sm" [class]="rowsOpen() ? 'icon-arrow-up' : 'icon-arrow-down'" aria-hidden="true"></i>
				</span>
			</span>
			<!-- /dep:dropdown-select -->
		</div>

		<!-- Page n of N -->
		<div class="u-display-flex u-align-items-center u-gap-sm">
			<span>Page</span>
			<!-- dep:input provisional · replace with <int-input> (number) when input is done -->
			<input
				type="text"
				inputmode="numeric"
				size="2"
				class="u-px-3 u-radius-sm u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-bold u-text-center u-color-body"
				aria-label="Page"
				data-dep="input"
				[value]="currentPage()"
				(change)="onPageSelect($event)"
			/>
			<!-- /dep:input -->
			<span class="u-text-nowrap">of {{ totalPages() }}</span>
		</div>
	</div>
</ng-template>
