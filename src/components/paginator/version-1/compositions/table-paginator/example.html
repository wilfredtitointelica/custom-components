<!--
  title: Table paginator
  description: Paginador al pie de una tabla, alineado a la derecha: en `templateLeft` el selector de filas por página (`int-select` con `variant="text"`) y el campo "Page n of N" (`int-inputnumber`), y después las flechas de página anterior y siguiente. Se arma con `showPageLinks`, `showFirstLastIcon`, `showCurrentPageReport` y `showJumpToPageInput` en `false`.
-->

<!-- Table paginator: closes the panel of the table, aligned to the end -->
<div class="u-display-flex u-justify-content-end">
	<int-paginator
		[showJumpToPageInput]="false"
		[showCurrentPageReport]="false"
		[showPageLinks]="false"
		[showFirstLastIcon]="false"
		[totalRecords]="totalRecords"
		[rows]="rowsPerPage()"
		[first]="(currentPage() - 1) * rowsPerPage()"
		[templateLeft]="tableTemplateLeft"
		(onPageChange)="onPageChange($event)"
	/>
</div>

<!-- Rows per page and page number: inside templateLeft, not the built-in controls -->
<ng-template #tableTemplateLeft>
	<div class="u-display-flex u-align-items-center u-gap-lg">
		<!-- Rows per page -->
		<div class="u-display-flex u-align-items-center u-gap-lg">
			<span class="u-text-nowrap" id="table-paginator-rows-label">Rows per page</span>

			<int-select
				variant="text"
				placement="top"
				ariaLabelledBy="table-paginator-rows-label"
				[options]="pageSizes"
				[ngModel]="rowsPerPage()"
				(ngModelChange)="selectRowsPerPage($event)"
			/>
		</div>

		<!-- Page n of N -->
		<div class="u-display-flex u-align-items-center u-gap-sm">
			<span>Page</span>
			<int-inputnumber
				ariaLabel="Page"
				[min]="1"
				[max]="totalPages()"
				[useGrouping]="false"
				[ngModel]="currentPage()"
				(ngModelChange)="onPageSelect($event)"
			/>
			<span class="u-text-nowrap">of {{ totalPages() }}</span>
		</div>
	</div>
</ng-template>
