<!--
  title: Append To Body
  description: Con `appendTo` en `body` la lista de `rowsPerPageOptions`, que se abre hacia arriba, no la recorta ni le agrega scroll un contenedor con `overflow`; arriba el mismo caso sin `appendTo`, donde la lista queda cortada. Montado fuera, su `z-index` es 1000 (el de los overlays) o el que indique `baseZIndex` (aquí `9`, debajo del encabezado fijo de la página, que está en 10).
-->
<div class="u-display-flex u-flex-column u-gap-lg">
  <!-- Without appendTo: the list stays inside the container and is cut at its top edge -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">Sin appendTo</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <span class="u-text-sm u-color-grey-500">La lista se corta aquí</span>
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <int-paginator
        [totalRecords]="120"
        [rows]="rowsClipped()"
        [first]="firstClipped()"
        [rowsPerPageOptions]="[10, 20, 30]"
        (onPageChange)="firstClipped.set($event.first); rowsClipped.set($event.rows)"
      />
    </div>
  </div>

  <!-- appendTo="body": the list lives in the body, so it is not cut -->
  <div class="u-display-flex u-flex-column u-gap-xs">
    <span class="u-text-sm u-color-grey-500">appendTo="body"</span>
    <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
      <span class="u-text-sm u-color-grey-500">La lista pasa por encima del borde</span>
      <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
      <int-paginator
        appendTo="body"
        [baseZIndex]="9"
        [totalRecords]="120"
        [rows]="rows()"
        [first]="first()"
        [rowsPerPageOptions]="[10, 20, 30]"
        (onPageChange)="first.set($event.first); rows.set($event.rows)"
      />
    </div>
  </div>
</div>
