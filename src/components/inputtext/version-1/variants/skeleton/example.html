<!--
  title: Skeleton
  description: Con `[intSkeleton]` el campo se muestra como skeleton con su tamaño real: `intSize`, `fluid` y el alto del `textarea` se conservan, sin medidas propias del skeleton.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <input intInputText intSize="small" placeholder="Small" [intSkeleton]="loading()" />
    <input intInputText placeholder="Normal" [intSkeleton]="loading()" />
    <input intInputText intSize="large" placeholder="Large" [intSkeleton]="loading()" />
  </div>
  <textarea intInputText rows="3" placeholder="Comments" fluid [intSkeleton]="loading()"></textarea>
</div>
