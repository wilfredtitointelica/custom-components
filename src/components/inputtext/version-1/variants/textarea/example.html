<!--
  title: Textarea
  description: La directiva `intInputText` también se aplica a un `<textarea>`, que crece en vertical; acepta los mismos estados y `fluid`.
-->
<div>
  <textarea intInputText rows="3" placeholder="Comments" aria-label="Comments"></textarea>
  <textarea intInputText fluid rows="3" placeholder="Comments (fluid)" aria-label="Comments (fluid)"></textarea>
</div>
