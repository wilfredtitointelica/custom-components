<!--
  title: Disabled
  description: El atributo nativo `disabled` deja el campo deshabilitado: no se puede editar ni seleccionar.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <input intInputText placeholder="Default" aria-label="Default" [style]="{ width: '20rem' }" />
  <input intInputText placeholder="Disabled" aria-label="Disabled" disabled [style]="{ width: '20rem' }" />
</div>
