<!--
  title: Fluid
  description: Con `fluid` el campo ocupa todo el ancho de su contenedor.
-->
<!-- The preview shrinks to its content: the first row sets the width that the fluid field fills. -->
<div class="u-display-flex u-flex-column u-gap-sm">
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <input intInputText placeholder="First name" aria-label="First name" />
    <input intInputText placeholder="Last name" aria-label="Last name" />
  </div>
  <input intInputText fluid placeholder="Fluid" aria-label="Fluid" />
</div>
