<!--
  title: Sizes
  description: intSize="small" | "large"; se llama intSize porque size es un atributo nativo del input.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <input intInputText intSize="small" placeholder="Small" aria-label="Small" [style]="{ width: '20rem' }" />
  <input intInputText placeholder="Default" aria-label="Default" [style]="{ width: '20rem' }" />
  <input intInputText intSize="large" placeholder="Large" aria-label="Large" [style]="{ width: '20rem' }" />
</div>
