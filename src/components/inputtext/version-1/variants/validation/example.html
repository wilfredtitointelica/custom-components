<!--
  title: Validation
  description: El estilo inválido aparece solo cuando el control se toca o se edita; invalid lo fuerza.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <input intInputText type="email" placeholder="Email (required)" aria-label="Email" [style]="{ width: '20rem' }" [formControl]="email" />
  <input intInputText placeholder="Forced invalid" aria-label="Forced invalid" invalid [style]="{ width: '20rem' }" />
</div>
