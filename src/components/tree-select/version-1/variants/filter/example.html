<!--
  title: Filter
  description: Con `filter` el panel muestra un buscador arriba del árbol; al escribir se ven los nodos que coinciden y sus padres se abren.
-->
<int-tree-select [style]="{ width: '20rem' }" selectionMode="checkbox" filter [options]="nodes" [(ngModel)]="selected" filterPlaceholder="Search text here" placeholder="Select items" />
