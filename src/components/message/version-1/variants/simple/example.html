<!--
  title: Simple
  description: Con variant="simple" el mensaje se muestra sin fondo, borde ni padding; el texto toma el color de la severidad. Útil como texto de ayuda bajo un campo.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <int-message severity="info" variant="simple" size="small">Help text</int-message>
  <int-message severity="success" variant="simple" size="small" icon="icon icon-success">Changes saved</int-message>
  <int-message severity="warn" variant="simple" size="small" icon="icon icon-warning">Check this value</int-message>
  <int-message severity="error" variant="simple" size="small" icon="icon icon-alert">Invalid input format</int-message>
</div>
