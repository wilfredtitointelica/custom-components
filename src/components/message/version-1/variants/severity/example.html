<!--
  title: Severity
  description: La propiedad `severity` define el tipo de mensaje: `info`, `success`, `warn`, `error` y `secondary`, que es el estado neutro que Figma llama Loading.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <int-message severity="info">Info Message</int-message>
  <int-message severity="success">Success Message</int-message>
  <int-message severity="warn">Warn Message</int-message>
  <int-message severity="error">Error Message</int-message>
  <int-message severity="secondary">Secondary Message</int-message>
</div>
