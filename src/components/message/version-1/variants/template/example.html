<!--
  title: Template
  description: El template #container reemplaza el contenido y recibe closeCallback para cerrar desde un botón propio; #icon reemplaza el ícono. El contenido se maqueta con helpers.
-->
<int-message severity="info" closable>
  <ng-template #icon>
    <i class="icon icon-info" aria-hidden="true"></i>
  </ng-template>
  <ng-template #container let-closeCallback="closeCallback">
    <div class="u-display-flex u-flex-column u-flex-grow-1">
      <span class="u-text-lg u-text-lineHeight-lg u-bold">What Happens Next</span>
      <span>• Wait for official confirmation via email (2-3 business days)</span>
      <span>• Your request will be processed once received</span>
      <span>• Contact support if you don't receive confirmation</span>
    </div>
    <!-- dep:button provisional · replace with <int-button> when button is done -->
    <button type="button" class="u-px-2 u-py-1 u-radius-lg u-background-white u-pointer" data-dep="button" (click)="closeCallback($event)">Got it</button>
    <!-- /dep:button -->
  </ng-template>
</int-message>
