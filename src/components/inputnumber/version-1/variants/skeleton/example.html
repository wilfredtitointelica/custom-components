<!--
  title: Skeleton
  description: Con `[intSkeleton]` el campo numérico se muestra como skeleton con su tamaño real, también con los botones apilados u horizontales.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <int-inputnumber placeholder="Rate" ariaLabel="Rate" [intSkeleton]="loading()" />
    <int-inputnumber showButtons placeholder="Stacked" ariaLabel="Stacked" [intSkeleton]="loading()" />
    <int-inputnumber showButtons buttonLayout="horizontal" placeholder="Horizontal" ariaLabel="Horizontal" [intSkeleton]="loading()" />
  </div>
</div>
