<!--
  title: States
  description: size, invalid y disabled.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <int-inputnumber size="small" ariaLabel="Small" [style]="{ width: '20rem' }" [ngModel]="1500" />
  <int-inputnumber ariaLabel="Invalid" invalid [style]="{ width: '20rem' }" [ngModel]="1500" />
  <int-inputnumber ariaLabel="Disabled" disabled [style]="{ width: '20rem' }" [ngModel]="1500" />
</div>
