<!--
  title: Prefix & suffix
  description: prefix y suffix se agregan al valor formateado; max limita el valor al salir del campo.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <int-inputnumber suffix=" %" [max]="100" ariaLabel="Percentage" [style]="{ width: '20rem' }" [(ngModel)]="percentage" />
  <int-inputnumber prefix="≈ " suffix=" txn" ariaLabel="Transactions" [style]="{ width: '20rem' }" [(ngModel)]="txn" />
</div>
