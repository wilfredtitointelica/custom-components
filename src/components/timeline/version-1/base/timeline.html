<!--
  title: Timeline
  description: Timeline muestra una serie de eventos encadenados.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=14482-36062&t=praSDC84iM8fhCvv-4
  figma-frame: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=14482-36062
-->

<!-- One row per event; events have no id, so they are tracked by position -->
@for (event of value(); track $index; let last = $last) {
  <div class="int-timeline__event">
    <!-- Opposite side. int-* extension: only with the #opposite template or in alternate (see showOpposite) -->
    @if (showOpposite()) {
      <div class="int-timeline__event-opposite">
        <ng-container [ngTemplateOutlet]="oppositeTemplate() ?? null" [ngTemplateOutletContext]="{ $implicit: event }" />
      </div>
    }

    <!-- Separator: the #marker template replaces the default marker; no connector after the last event -->
    <div class="int-timeline__event-separator">
      @if (markerTemplate(); as marker) {
        <ng-container [ngTemplateOutlet]="marker" [ngTemplateOutletContext]="{ $implicit: event }" />
      } @else {
        <div class="int-timeline__event-marker"></div>
      }
      @if (!last) {
        <div class="int-timeline__event-connector"></div>
      }
    </div>

    <div class="int-timeline__event-content">
      <ng-container [ngTemplateOutlet]="contentTemplate() ?? null" [ngTemplateOutletContext]="{ $implicit: event }" />
    </div>
  </div>
}
