<!--
  title: Basic
  description: Diálogo con formulario - [(visible)] lo abre y cierra, [style] fija el ancho y #footer define las acciones.
-->
<button intButton label="Set alert" icon="icon icon-notification" (click)="visible.set(true)"></button>
<int-dialog-modal header="Set alert" [(visible)]="visible" [style]="{ width: '32rem' }">
  <div class="u-display-flex u-flex-column u-gap-md">
    <div class="u-display-flex u-flex-column u-gap-xs">
      <label for="dm-alert-name">Name</label>
      <input id="dm-alert-name" intInputText fluid [(ngModel)]="name" />
    </div>
    <div class="u-display-flex u-flex-column u-gap-xs">
      <label for="dm-alert-brand">Brand</label>
      <int-dropdown-select inputId="dm-alert-brand" fluid [options]="brands" optionLabel="name" optionValue="code" [(ngModel)]="brand" placeholder="Select" />
    </div>
    <div class="u-display-flex u-flex-column u-gap-xs">
      <label for="dm-alert-date">Effective date</label>
      <int-date-picker inputId="dm-alert-date" fluid [(ngModel)]="date" dateFormat="dd/mm/yy" showIcon />
    </div>
  </div>
  <ng-template #footer>
    <button intButton label="Cancel" severity="secondary" (click)="visible.set(false)"></button>
    <button intButton label="Save" (click)="visible.set(false)"></button>
  </ng-template>
</int-dialog-modal>
