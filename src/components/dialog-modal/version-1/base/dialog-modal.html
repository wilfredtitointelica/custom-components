<!--
  title: Dialog / Modal
  description: Ventana modal en un overlay del CDK - el foco queda atrapado y vuelve al botón que la abrió, Escape la cierra y el scroll de la página se bloquea. Los overlays anidados (Dropdown-select, Date-picker) se cierran primero con Escape.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=2354-3101&m=dev
-->
<ng-template #dialog>
  <div
    class="int-dialog-modal"
    role="dialog"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="focusOnShow()"
    [class]="panelClass()"
    [ngStyle]="style()"
    [attr.aria-modal]="modal()"
    [attr.aria-labelledby]="headerId"
  >
    <div class="int-dialog-modal__header">
      <div class="int-dialog-modal__title" [id]="headerId">
        @if (headerTemplate(); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl" />
        } @else {
          {{ header() }}
        }
      </div>
      @if (closable()) {
        <!-- Figma icon-button: the bare text + icon-only int-button (24px box, 16px icon). -->
        <button
          intButton
          type="button"
          class="int-dialog-modal__close"
          variant="text"
          icon="icon icon-cancel"
          [ariaLabel]="config.t('close')"
          (click)="close()"
        ></button>
      }
    </div>
    <div class="int-dialog-modal__content">
      <ng-content />
    </div>
    @if (footerTemplate(); as tpl) {
      <div class="int-dialog-modal__footer">
        <ng-container [ngTemplateOutlet]="tpl" />
      </div>
    }
  </div>
</ng-template>
