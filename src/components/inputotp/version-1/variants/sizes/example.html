<!--
  title: Sizes
  description: Con `size` cambia el tamaño de las celdas: `small`, por defecto y `large`.
-->
<div class="u-display-flex u-flex-column u-gap-lg">
  <int-inputotp size="small" [(ngModel)]="small" />
  <int-inputotp [(ngModel)]="normal" />
  <int-inputotp size="large" [(ngModel)]="large" />
</div>
