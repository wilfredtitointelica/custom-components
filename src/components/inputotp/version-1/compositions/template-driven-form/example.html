<!--
  title: Template Driven Form
  description: Código obligatorio dentro de un formulario: `required` con `ngModel`, e `invalid` cuando el campo se tocó o el formulario se envió; el mensaje de error y el botón de envío van debajo.
-->
<form #exampleForm="ngForm" class="u-display-flex u-flex-column u-align-items-center u-gap-md" (ngSubmit)="onSubmit(exampleForm)">
  <div class="u-display-flex u-flex-column u-gap-xs">
    <int-inputotp
      integerOnly
      name="passcode"
      #otpModel="ngModel"
      required
      [invalid]="!!otpModel.invalid && (!!otpModel.touched || exampleForm.submitted)"
      [(ngModel)]="value"
    />
    @if (otpModel.invalid && (otpModel.touched || exampleForm.submitted)) {
      <!-- dep:message provisional · replace with <int-message severity="error" size="small" variant="simple"> when message is done -->
      <span class="u-msg-error" data-dep="message">Passcode is required.</span>
      <!-- /dep:message -->
    }
  </div>
  <int-button type="submit" label="Submit" />
</form>
