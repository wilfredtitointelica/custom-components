<!--
  title: Authenticate Account
  description: Pantalla de verificación: código de 6 dígitos con `grouped`, `size="small"` y `separatorAt="3"` (el template `separator` dibuja un guion), bajo un título y una indicación, con las acciones para reenviar y enviar el código alineadas al ancho del código.
-->
<div class="u-display-flex u-flex-column u-align-items-center">
  <span class="u-heading-xl u-bold u-color-body u-mb-2">Authenticate Your Account</span>
  <span class="u-text-md u-color-grey-500 u-mb-5">Please enter the code sent to your phone.</span>
  <div class="u-display-flex u-flex-column u-gap-xl">
    <int-inputotp grouped integerOnly size="small" [length]="6" separatorAt="3" [(ngModel)]="value">
      <ng-template #separator>
        <span class="u-text-xl u-color-body">–</span>
      </ng-template>
    </int-inputotp>
    <div class="u-display-flex u-justify-content-between u-align-items-center">
      <!-- dep:button provisional · replace with <int-button label="Resend Code" variant="text"> and <int-button label="Submit Code"> when button is done -->
      <span class="u-px-3 u-py-2 u-radius-lg u-text-md u-bold u-color-body u-pointer" role="button" tabindex="0" data-dep="button">
        Resend Code
      </span>
      <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-bold u-color-body u-pointer" data-dep="button">
        Submit Code
      </button>
      <!-- /dep:button -->
    </div>
  </div>
</div>
