<!--
  title: Month picker
  description: `view="month"` elige meses (el valor es el primer día del mes); con `selectionMode="range"` el rango se pinta completo. `maxDate` deshabilita los meses futuros.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <int-date-picker [(ngModel)]="month" view="month" dateFormat="M, yy" placeholder="mm, yyyy" [maxDate]="today" showIcon ariaLabel="Month" />
    <int-date-picker [(ngModel)]="monthRange" view="month" selectionMode="range" dateFormat="M, yy" placeholder="mm, yyyy - mm, yyyy" [maxDate]="today" showIcon ariaLabel="Month range" />
  </div>
  <p class="u-m-0 u-text-sm">Value: {{ monthRange | json }}</p>
</div>
