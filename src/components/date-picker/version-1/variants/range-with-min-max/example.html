<!--
  title: Range with min & max
  description: selectionMode="range" guarda [inicio, fin]; minDate y maxDate limitan el rango (aquí, los últimos 90 días). showButtonBar agrega Hoy y Limpiar.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <int-date-picker
    [(ngModel)]="range"
    selectionMode="range"
    dateFormat="dd/mm/yy"
    [minDate]="minDate"
    [maxDate]="maxDate"
    showIcon
    showButtonBar
    placeholder="Period"
    ariaLabel="Period"
  />
  <p class="u-m-0 u-text-sm">Value: {{ range | json }}</p>
</div>
