<!--
  title: Ancho automático
  description: Con `[style]="{ width: 'auto' }"` el toast se ajusta al contenido en lugar de usar el ancho fijo.
-->
<int-toast key="toastAutoWidth" position="bottom-right" [style]="{ width: 'auto' }" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <button intButton severity="secondary" label="Show" (click)="show()"></button>
</div>
