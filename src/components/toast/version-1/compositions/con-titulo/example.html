<!--
  title: Con título
  description: Notificación estándar con `summary` y `detail`, posición `bottom-right` y `life` de 5 segundos; la severidad elige el color y el icono.
-->
<int-toast key="toastStandard" position="bottom-right" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  @for (severity of severities; track severity) {
    <button intButton severity="secondary" [label]="severity" (click)="show(severity)"></button>
  }
</div>
