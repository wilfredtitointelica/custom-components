<!--
  title: Ancho limitado
  description: Con `[style]` el toast se ajusta al contenido hasta un ancho máximo (`41.25rem`).
-->
<int-toast key="toastLimitWidth" position="bottom-right" [style]="{ width: 'auto', maxWidth: '41.25rem' }" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <button intButton severity="secondary" label="Show" (click)="show()"></button>
</div>
