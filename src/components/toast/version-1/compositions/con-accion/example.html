<!--
  title: Con acción
  description: El template `message` agrega un botón de acción junto al texto; el toast usa una `key` propia para no mezclarse con el estándar.
-->
<int-toast key="toastAction" position="bottom-right">
  <ng-template #message let-message>
    <div class="u-display-flex u-align-items-center u-gap-lg u-flex-grow-1">
      <div class="u-display-flex u-gap-sm u-flex-grow-1">
        <i class="icon icon-info" aria-hidden="true"></i>
        <div class="u-display-flex u-flex-column u-color-primary">
          <span class="u-bold u-text-md">{{ message.summary }}</span>
          <span class="u-text-sm">{{ message.detail }}</span>
        </div>
      </div>
      <!-- dep:button provisional · replace with <int-button> when button is done -->
      <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button">View report</button>
      <!-- /dep:button -->
    </div>
  </ng-template>
</int-toast>
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show()">Show</button>
  <!-- /dep:button -->
</div>
