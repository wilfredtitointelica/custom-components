<!--
  title: Sin título
  description: Mismo toast con solo `detail`: sin `summary` el icono se alinea con la primera línea del texto.
-->
<int-toast key="toastNoTitle" position="bottom-right" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  @for (severity of severities; track severity) {
    <button intButton severity="secondary" [label]="severity" (click)="show(severity)"></button>
  }
</div>
