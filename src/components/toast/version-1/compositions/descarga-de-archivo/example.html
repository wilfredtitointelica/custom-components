<!--
  title: Descarga de archivo
  description: Al exportar un PDF o un Excel, un toast `secondary` sin cierre (`closable: false`, `sticky`) avisa que el archivo se está preparando; al terminar, `clear` de su `key` lo reemplaza por un toast `success` o `error` con el resultado. La descarga se simula.
-->
<int-toast key="download" position="bottom-right" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  @for (file of files; track file.label) {
    <button type="button" class="u-display-inline-flex u-align-items-center u-gap-sm u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" [disabled]="busy()" (click)="download(file)">
      <i [class]="file.icon" aria-hidden="true"></i>
      {{ file.label }}
    </button>
  }
  <!-- /dep:button -->
</div>
