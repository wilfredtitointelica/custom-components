<!--
  title: Responsive
  description: El input `breakpoints` aplica estilos al toast según el ancho de la pantalla; aquí ocupa todo el ancho por debajo de 920px.
-->
<int-toast [breakpoints]="breakpoints" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <button intButton severity="secondary" label="Show" (click)="show()"></button>
</div>
