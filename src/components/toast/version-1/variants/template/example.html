<!--
  title: Template
  description: El template `message` reemplaza el icono y el texto de cada mensaje; el botón de cerrar se conserva. Recibe el mensaje como `$implicit` y toma el color de su `severity` (aquí `success`); "Reply" lo cierra con `clear` y la `key` del toast.
-->
<int-toast key="confirm" position="bottom-center">
  <ng-template #message let-message>
    <div class="u-display-flex u-flex-column u-gap-md u-flex-grow-1">
      <div class="u-display-flex u-align-items-center u-gap-sm">
        <span class="u-display-inline-flex u-justify-content-center u-align-items-center u-p-2 u-radius-xl u-background-white u-text-xs u-bold" role="img" aria-label="Amy Elsner">AE</span>
        <span class="u-bold u-text-md">Amy Elsner</span>
      </div>
      <span class="u-text-lg u-bold u-color-trend-positive">{{ message.summary }}</span>
      <div class="u-display-flex">
        <!-- dep:button provisional · replace with <int-button severity="success" size="small"> when button is done -->
        <!-- A span, not a <button>: no helper removes the native button border; keyboard as a button. -->
        <span
          class="u-px-3 u-py-1 u-radius-lg u-background-green-amex u-color-white u-text-sm u-bold u-pointer"
          role="button"
          tabindex="0"
          data-dep="button"
          (click)="reply()"
          (keydown.enter)="reply()"
          (keydown.space)="$event.preventDefault(); reply()"
          >Reply</span
        >
        <!-- /dep:button -->
      </div>
    </div>
  </ng-template>
</int-toast>
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show()">View</button>
  <!-- /dep:button -->
</div>
