<!--
  title: Headless
  description: El template `headless` reemplaza todo el mensaje, botón de cerrar incluido; recibe el mensaje y `closeFn` para cerrarlo. Aquí, con `severity` `contrast`, arma una carga de archivos con `int-progressbar` y dos acciones.
-->
<int-toast position="top-center" (onClose)="stop()">
  <ng-template #headless let-message let-closeFn="closeFn">
    <div class="u-display-flex u-flex-column u-gap-md u-p-4">
      <div class="u-display-flex u-align-items-center u-gap-sm">
        <i class="icon icon-upload" aria-hidden="true"></i>
        <span class="u-bold u-text-md">{{ message.summary }}</span>
      </div>
      <div class="u-display-flex u-flex-column u-gap-sm">
        <int-progressbar severity="info" [value]="progress()" [showValue]="false" ariaLabel="Upload progress" [style]="{ height: '0.25rem' }" />
        <span class="u-bold u-text-sm">{{ progress() }}% uploaded</span>
      </div>
      <div class="u-display-flex u-justify-content-end u-gap-sm">
        <button intButton severity="secondary" size="small" label="Another Upload?" (click)="restart()"></button>
        <button intButton severity="secondary" size="small" label="Cancel" (click)="closeFn($event)"></button>
      </div>
    </div>
  </ng-template>
</int-toast>
<div class="u-display-flex u-flex-wrap u-gap-md">
  <button intButton severity="secondary" label="Show" (click)="show()"></button>
</div>
