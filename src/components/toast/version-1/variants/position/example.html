<!--
  title: Position
  description: El input `position` ubica el toast en la ventana: `top-left`, `top-center`, `top-right`, `bottom-left`, `bottom-center`, `bottom-right` o `center`. Cada toast escucha su propia `key`.
-->
<int-toast key="tl" position="top-left" />
<int-toast key="bl" position="bottom-left" />
<int-toast key="br" position="bottom-right" />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show('tl')">Top left</button>
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show('bl')">Bottom left</button>
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show('br')">Bottom right</button>
  <!-- /dep:button -->
</div>
