<!--
  title: Animation
  description: Los inputs `showTransformOptions`, `hideTransformOptions`, `showTransitionOptions` y `hideTransitionOptions` cambian la animación de entrada y salida. Con movimiento reducido no se anima.
-->
<int-toast
  showTransformOptions="translateX(100%)"
  hideTransformOptions="translateX(100%)"
  showTransitionOptions="1000ms ease-out"
  hideTransitionOptions="1000ms ease-in"
/>
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show()">Show</button>
  <!-- /dep:button -->
</div>
