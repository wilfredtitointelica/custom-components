<!--
  title: Severity
  description: El campo `severity` del mensaje define el color: `success`, `info`, `warn`, `error`, `secondary` y `contrast`. Cada severidad trae su icono por defecto.
-->
<int-toast />
<div class="u-display-flex u-flex-wrap u-gap-md">
  @for (severity of severities; track severity) {
    <button intButton severity="secondary" [label]="severity" (click)="show(severity)"></button>
  }
</div>
