<!--
  title: Sticky
  description: Un mensaje con `sticky: true` no se cierra solo; se quita con su botón o con `clear` del servicio. `life` cambia el tiempo de un mensaje.
-->
<int-toast />
<div class="u-display-flex u-flex-wrap u-gap-md">
  <!-- dep:button provisional · replace with <int-button> when button is done -->
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="show()">Sticky</button>
  <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button" (click)="clear()">Clear</button>
  <!-- /dep:button -->
</div>
