<!--
  title: Lazy & select on focus
  description: lazy dibuja el contenido de un panel solo mientras está activo; selectOnFocus activa la pestaña al recibir foco con las flechas.
-->
<int-tabs value="visa" lazy selectOnFocus>
  <int-tablist>
    <int-tab value="visa">Visa</int-tab>
    <int-tab value="mastercard">Mastercard</int-tab>
  </int-tablist>
  <int-tabpanels>
    <int-tabpanel value="visa">Visa content</int-tabpanel>
    <int-tabpanel value="mastercard">Mastercard content</int-tabpanel>
  </int-tabpanels>
</int-tabs>
