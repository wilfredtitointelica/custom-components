<!--
  title: Disabled
  description: Con `disabled` el toggle no responde, apagado y encendido tienen el mismo aspecto y el label pasa a gris.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-lg">
  <int-toggle-switch [ngModel]="false" ariaLabel="Disabled off" disabled />
  <int-toggle-switch [ngModel]="true" ariaLabel="Disabled on" disabled />
  <div class="u-display-flex u-align-items-center u-gap-sm">
    <int-toggle-switch [ngModel]="false" inputId="disabled-off" disabled />
    <label for="disabled-off" class="u-text-md u-color-grey-500">Text here</label>
  </div>
  <div class="u-display-flex u-align-items-center u-gap-sm">
    <int-toggle-switch [ngModel]="true" inputId="disabled-on" disabled />
    <label for="disabled-on" class="u-text-md u-color-grey-500">Text here</label>
  </div>
</div>
