<!--
  title: Forms
  description: Se integra con formularios de Angular (`ngModel`, `name`, `required`). Como un `false` no cuenta como vacío para `required`, el ejemplo valida que esté encendido y muestra el error al enviar.
-->
<form class="u-display-flex u-flex-column u-gap-md" (ngSubmit)="submitted.set(true)">
  <div class="u-display-flex u-flex-column u-gap-xs">
    <div class="u-display-flex u-align-items-center u-gap-sm">
      <int-toggle-switch [(ngModel)]="accepted" name="terms" inputId="terms" required [invalid]="showError()" />
      <label for="terms" class="u-text-md u-color-body">Acepto los términos</label>
    </div>
    @if (showError()) {
      <span class="u-text-sm u-color-error">Debes aceptar los términos.</span>
    }
  </div>
  <div>
    <button intButton type="submit" label="Submit"></button>
  </div>
</form>
