<!--
  title: Template
  description: Los templates `icon`, `message` y `footer` reemplazan el ícono, el texto y los botones; reciben `onAccept`, `onReject` y `onCancel` para cerrar.
-->
<int-confirm-dialog-modal key="template">
  <ng-template #icon>
    <i class="icon icon-overlay-success" aria-hidden="true"></i>
  </ng-template>
  <ng-template #message let-confirmation>
    <div class="u-display-flex u-flex-column u-gap-xs u-text-center">
      <span class="u-text-xl u-bold">{{ confirmation.header }}</span>
      <span class="u-text-lg">{{ confirmation.message }}</span>
    </div>
  </ng-template>
  <ng-template #footer let-onAccept="onAccept" let-onReject="onReject">
    <button intButton label="Great" (click)="onAccept()"></button>
    <button intButton label="Later" severity="secondary" (click)="onReject()"></button>
  </ng-template>
</int-confirm-dialog-modal>
<button intButton label="Publish" (click)="confirm()"></button>
