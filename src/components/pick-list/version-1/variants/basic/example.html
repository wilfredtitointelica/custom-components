<!--
  title: Basic
  description: Selecciona items con un clic y usa los botones del centro para pasar los seleccionados o todos al destino y devolverlos; con `dragdrop` también se pasan arrastrándolos (si el item está seleccionado, se mueve toda la selección) y se reordenan dentro de cada lista.
-->
<int-pick-list dragdrop [(source)]="source" [(target)]="target" sourceHeader="Available" targetHeader="Selected" [style]="{ width: '36rem' }" />
