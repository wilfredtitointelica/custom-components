<!--
  title: Sizes
  description: int-* extension: `size` cambia el alto del tag: `small` (24px), sin valor mediano (32px) y `large` (36px). El icono pasa de 12px a 16px desde el mediano.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
  <int-tag size="small" severity="info" icon="icon icon-info" value="Small" />
  <int-tag severity="info" icon="icon icon-info" value="Medium" />
  <int-tag size="large" severity="info" icon="icon icon-info" value="Large" />
</div>
