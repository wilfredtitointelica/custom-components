<!--
  title: Severity
  description: El input `severity` define el color: `secondary`, `info`, `success`, `warn`, `danger` y `contrast`, y `caution` como extensión `int-*`. Sin `severity` el tag es primario.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
  <int-tag value="Primary" />
  <int-tag severity="secondary" value="Secondary" />
  <int-tag severity="info" value="Info" />
  <int-tag severity="success" value="Success" />
  <int-tag severity="caution" value="Caution" />
  <int-tag severity="warn" value="Warn" />
  <int-tag severity="danger" value="Danger" />
  <int-tag severity="contrast" value="Contrast" />
</div>
