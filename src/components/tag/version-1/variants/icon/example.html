<!--
  title: Icon
  description: El input `icon` agrega un icono antes del valor. El icono toma el color del texto de la severidad.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
  <int-tag icon="icon icon-user" value="Primary" />
  <int-tag severity="info" icon="icon icon-info" value="Info" />
  <int-tag severity="success" icon="icon icon-check" value="Success" />
  <int-tag severity="caution" icon="icon icon-alert" value="Caution" />
  <int-tag severity="warn" icon="icon icon-alert" value="Warn" />
  <int-tag severity="danger" icon="icon icon-alert" value="Danger" />
</div>
