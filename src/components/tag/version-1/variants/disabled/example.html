<!--
  title: Disabled
  description: int-* extension: `disabled` apaga el tag con los colores de deshabilitado, sin importar la `severity`, y agrega `aria-disabled`.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
  <int-tag severity="success" icon="icon icon-check" value="Disabled" disabled />
  <int-tag size="large" severity="danger" icon="icon icon-alert" value="Disabled" disabled />
</div>
