<!--
  title: Status
  description: Los estados del design system como tags `rounded` con `severity`: Default (`secondary`), Info, Success, Caution, Warning (`warn`), Error (`danger`) y Disabled (`disabled`). El caso base va solo con texto; con un icono de 12px a la izquierda solo cuando el diseño lo muestra.
-->
<div class="u-display-flex u-flex-column u-gap-xl">
  <div class="u-display-flex u-flex-column u-gap-md">
    <p class="u-m-0 u-text-md u-bold">Text only</p>
    <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
      @for (status of statuses; track status.value) {
        <int-tag size="small" [severity]="status.severity" rounded [value]="status.value" [disabled]="status.disabled ?? false" />
      }
    </div>
  </div>

  <div class="u-display-flex u-flex-column u-gap-md">
    <p class="u-m-0 u-text-md u-bold">With icon</p>
    <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-md">
      @for (status of statuses; track status.value) {
        <int-tag
          size="small"
          [severity]="status.severity"
          rounded
          [icon]="status.icon"
          [value]="status.value"
          [disabled]="status.disabled ?? false"
        />
      }
    </div>
  </div>
</div>
