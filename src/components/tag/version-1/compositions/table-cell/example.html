<!--
  title: Table Cell
  description: Tag de estado dentro de una celda de tabla, centrado con helpers. La `severity` sale de cada fila, así el estado cambia con los datos.
-->
<int-table [value]="rows">
  <ng-template #header>
    <tr>
      <th class="u-text-left">Transaction</th>
      <th class="u-text-center">Status</th>
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      <td>{{ row.id }}</td>
      <td>
        <div class="u-display-flex u-justify-content-center">
          <int-tag size="small" [severity]="row.severity" rounded [value]="row.status" />
        </div>
      </td>
    </tr>
  </ng-template>
</int-table>
