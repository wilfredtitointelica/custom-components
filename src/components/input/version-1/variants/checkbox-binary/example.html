<!--
  title: Checkbox · Binary
  description: binary: el modelo es true / false (o trueValue / falseValue). La etiqueta se asocia con inputId + label for.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <div class="u-display-flex u-align-items-center u-gap-xs">
    <int-checkbox inputId="cb-binary-notify" binary [(ngModel)]="notify" />
    <label for="cb-binary-notify">Email me when fees change</label>
  </div>
  <p class="u-m-0 u-text-sm">Value: {{ notify }}</p>
</div>
