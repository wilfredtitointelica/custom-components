<!--
  title: Radio · Sizes & states
  description: size, invalid y disabled.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <int-radiobutton name="rb-s1" value="a" size="small" [ngModel]="'a'" ariaLabel="Small" />
  <int-radiobutton name="rb-s2" value="a" [ngModel]="'a'" ariaLabel="Default" />
  <int-radiobutton name="rb-s3" value="a" size="large" [ngModel]="'a'" ariaLabel="Large" />
  <int-radiobutton name="rb-s4" value="a" invalid ariaLabel="Invalid" />
  <int-radiobutton name="rb-s5" value="a" disabled ariaLabel="Disabled" />
  <int-radiobutton name="rb-s6" value="a" disabled [ngModel]="'a'" ariaLabel="Disabled checked" />
</div>
