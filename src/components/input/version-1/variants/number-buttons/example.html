<!--
  title: Number · Buttons
  description: showButtons con buttonLayout stacked (por defecto) u horizontal; las flechas del teclado también cambian el valor.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <int-inputnumber [(ngModel)]="qty" showButtons [min]="0" [max]="10" ariaLabel="Quantity" />
    <int-inputnumber [(ngModel)]="qty" showButtons buttonLayout="horizontal" [min]="0" [max]="10" ariaLabel="Quantity" />
  </div>
  <p class="u-m-0 u-text-sm">Value: {{ qty }}</p>
</div>
