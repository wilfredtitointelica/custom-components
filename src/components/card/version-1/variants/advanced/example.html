<!--
  title: Advanced
  description: Card con imagen en #header, título, subtítulo, contenido y acciones en #footer, como la demo Advanced de PrimeNG.
-->
<int-card class="u-overflow-hidden">
  <ng-template #header>
    <img alt="Card" class="u-display-block u-full-width" src="https://primefaces.org/cdn/primeng/images/card-ng.jpg" />
  </ng-template>
  <ng-template #title>Advanced Card</ng-template>
  <ng-template #subtitle>Card subtitle</ng-template>
  <p class="u-m-0">
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam
    deserunt quisquam repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque
    quas!
  </p>
  <ng-template #footer>
    <div class="u-display-flex u-gap-md u-mt-1">
      <!-- dep:button provisional · replace with <int-button> when button is done -->
      <button type="button" class="u-flex-grow-1 u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-pointer" data-dep="button">
        Cancel
      </button>
      <button type="button" class="u-flex-grow-1 u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-pointer" data-dep="button">
        Save
      </button>
      <!-- /dep:button -->
    </div>
  </ng-template>
</int-card>
