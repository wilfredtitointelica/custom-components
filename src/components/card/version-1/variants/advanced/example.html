<!--
  title: Advanced
  description: Card con imagen en #header, título, subtítulo, contenido y acciones en #footer.
-->
<int-card headerHeight="240px">
  <ng-template #header>
    <div class="u-display-flex u-justify-content-center u-align-items-center u-full-height u-background-surface u-color-grey-500" role="img" aria-label="Card image">
      <i class="icon icon-image icon--lg" aria-hidden="true"></i>
    </div>
  </ng-template>
  <ng-template #title>Advanced Card</ng-template>
  <ng-template #subtitle>Card subtitle</ng-template>
  <p class="u-m-0">
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam
    deserunt quisquam repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque
    quas!
  </p>
  <ng-template #footer>
    <div class="u-display-flex u-align-items-center u-gap-sm">
      <span class="u-flex-grow-1">Updated 2 days ago</span>
      <!-- dep:button provisional · replace with <int-button> when button is done -->
      <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button">
        Cancel
      </button>
      <button type="button" class="u-px-3 u-py-2 u-radius-lg u-bs-1 u-be-1 u-bt-1 u-bm-1 u-background-white u-text-md u-pointer" data-dep="button">
        Save
      </button>
      <!-- /dep:button -->
    </div>
  </ng-template>
</int-card>
