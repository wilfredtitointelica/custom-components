<!--
  title: Stretch Content
  description: Propiedad `stretchContent` (modificador `int-card--stretch-content`): body y content ocupan toda la altura de la card, para que un bloque con `u-flex-grow-1` (estado vacío, error) se centre en el espacio libre. Sin `stretchContent` el bloque queda bajo el título; con `stretchContent` se centra.
-->
<div class="u-display-flex u-flex-wrap u-gap-xl">
  @for (card of cards; track card.subheader) {
    <int-card header="Transactions" [subheader]="card.subheader" [stretchContent]="card.stretch" [style]="{ width: '18rem', height: '14rem' }">
      <div class="u-display-flex u-flex-column u-flex-grow-1 u-align-items-center u-justify-content-center u-gap-xs">
        <i class="icon icon-folder icon--md u-color-grey-500" aria-hidden="true"></i>
        <span class="u-color-grey-500">No data available</span>
      </div>
    </int-card>
  }
</div>
