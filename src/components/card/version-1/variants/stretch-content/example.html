<!--
  title: Stretch Content
  description: Propiedad stretchContent (modificador int-card--stretch-content): body y content ocupan toda la altura de la card, para que un bloque con u-flex-grow-1 (estado vacío, error) se centre en el espacio libre.
-->
<div class="u-display-flex u-flex-wrap u-gap-xl">
  <int-card stretchContent class="u-flex-grow-1 u-flex-basis-0" header="Transactions">
    <div class="u-display-flex u-flex-column u-flex-grow-1 u-align-items-center u-justify-content-center u-gap-xs u-py-5">
      <i class="icon icon-folder icon--md u-color-grey-500" aria-hidden="true"></i>
      <span class="u-color-grey-500">No data available</span>
    </div>
  </int-card>
  <int-card class="u-flex-grow-1 u-flex-basis-0" header="Volume">
    @for (row of rows; track row.label) {
      <div class="u-display-flex u-justify-content-between">
        <span>{{ row.label }}</span>
        <span class="u-bold">{{ row.value }}</span>
      </div>
    }
  </int-card>
</div>
