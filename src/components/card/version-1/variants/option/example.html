<!--
  title: Option
  description: appearance="option" (modificador int-card--option) para elegir una opción: la seleccionada queda con aria-pressed; se navega con Tab y se elige con clic o Enter/Espacio. La última está deshabilitada. Como la card es un botón, su contenido no lleva botones ni links.
-->
<div class="u-display-flex u-flex-wrap u-gap-lg">
  @for (option of options; track option.id) {
    <div class="u-display-flex u-flex-grow-1 u-flex-basis-0">
      <int-card
        appearance="option"
        selectable
        [selected]="chosen() === option.id"
        [disabled]="option.disabled"
        (onSelect)="chosen.set(option.id)"
      >
        <div class="u-display-flex u-justify-content-center">
          <i class="icon icon--md" [class]="option.icon" aria-hidden="true"></i>
        </div>
        <div class="u-display-flex u-flex-column u-justify-content-center u-text-center">
          <span class="u-text-sm u-bold">{{ option.title }}</span>
          <span class="u-text-xs">{{ option.description }}</span>
        </div>
      </int-card>
    </div>
  }
</div>
