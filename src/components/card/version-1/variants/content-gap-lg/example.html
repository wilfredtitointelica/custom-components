<!--
  title: Content Gap Lg
  description: Modificador int-card--content-gap-lg: el gap entre los bloques de #content pasa de 6px (por defecto) a 16px. Compara las dos cards.
-->
<div class="u-display-flex u-flex-wrap u-gap-xl">
  <int-card class="u-flex-grow-1 u-flex-basis-0" header="Default gap">
    <p class="u-m-0">First block</p>
    <p class="u-m-0">Second block</p>
    <p class="u-m-0">Third block</p>
  </int-card>
  <int-card class="int-card--content-gap-lg u-flex-grow-1 u-flex-basis-0" header="Content gap lg">
    <p class="u-m-0">First block</p>
    <p class="u-m-0">Second block</p>
    <p class="u-m-0">Third block</p>
  </int-card>
</div>
