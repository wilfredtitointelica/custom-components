<!--
  title: Template
  description: El contenido de la card se personaliza con los templates `header`, `title`, `subtitle` y `footer` (imagen arriba, título, subtítulo y acciones al pie); el contenido va proyectado o en el template `content`.
-->
<int-card headerHeight="240px">
  <ng-template #header>
    <div
      class="u-display-flex u-justify-content-center u-align-items-center u-full-height u-background-surface u-color-grey-500"
      role="img"
      aria-label="Card image"
    >
      <i class="icon icon-image icon--lg" aria-hidden="true"></i>
    </div>
  </ng-template>
  <ng-template #title>Template Card</ng-template>
  <ng-template #subtitle>Card subtitle</ng-template>
  <p class="u-m-0">
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error
    repudiandae numquam deserunt quisquam repellat libero asperiores earum nam nobis, culpa ratione
    quam perferendis esse, cupiditate neque quas!
  </p>
  <ng-template #footer>
    <div class="u-display-flex u-align-items-center u-gap-sm">
      <span class="u-flex-grow-1">Updated 2 days ago</span>
      <button intButton severity="secondary" variant="outlined" label="Cancel"></button>
      <button intButton label="Save"></button>
    </div>
  </ng-template>
</int-card>
