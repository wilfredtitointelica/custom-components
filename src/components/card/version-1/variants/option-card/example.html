<!--
  title: Option card
  description: Composición int-card--option para elegir una opción: la tarjeta seleccionada queda con aria-pressed (estado pressed); se navega con Tab y se elige con clic o Enter/Espacio. La última está deshabilitada.
-->
<div class="u-display-flex u-flex-wrap u-gap-lg" role="group" aria-label="Card brand">
  @for (option of options; track option.id) {
    <int-card
      class="int-card--option u-flex-grow-1 u-flex-basis-0"
      role="button"
      [attr.tabindex]="option.disabled ? -1 : 0"
      [attr.aria-disabled]="option.disabled || null"
      [attr.aria-pressed]="option.disabled ? null : selected() === option.id"
      (click)="select(option)"
      (keydown.enter)="select(option)"
      (keydown.space)="$event.preventDefault(); select(option)"
    >
      <div class="u-display-flex u-flex-column u-align-items-center u-gap-sm u-text-center">
        <i class="pi {{ option.icon }} u-text-2xl" aria-hidden="true"></i>
        <div class="u-display-flex u-flex-column">
          <span class="u-text-sm u-bold">{{ option.title }}</span>
          <span class="u-text-xs">{{ option.description }}</span>
        </div>
      </div>
    </int-card>
  }
</div>
