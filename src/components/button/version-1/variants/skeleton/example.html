<!--
  title: Skeleton
  description: Con `[intSkeleton]` el botón se muestra como skeleton con su tamaño real: cada `size`, el botón de solo icono y la forma `<int-button>` conservan su ancho, alto y radio, sin medidas propias del skeleton.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <button intButton label="Small" size="small" [intSkeleton]="loading()"></button>
    <button intButton label="Save" [intSkeleton]="loading()"></button>
    <button intButton label="Large" size="large" [intSkeleton]="loading()"></button>
    <button intButton icon="icon icon-download" ariaLabel="Download" [intSkeleton]="loading()"></button>
    <int-button label="Export" severity="secondary" [intSkeleton]="loading()" />
  </div>
</div>
