<!--
  title: Variants
  description: outlined, text y link usan la severity como color de acento.
-->
<button intButton label="Outlined" variant="outlined"></button>
<button intButton label="Secondary outlined" severity="secondary" variant="outlined"></button>
<button intButton label="Text" variant="text"></button>
<button intButton label="Danger text" severity="danger" variant="text"></button>
<a intButton variant="link" href="#" (click)="$event.preventDefault()">Link</a>
