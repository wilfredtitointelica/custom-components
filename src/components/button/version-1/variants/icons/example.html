<!--
  title: Icons
  description: Cualquier clase de icono (incontrol-icons: icon icon-*). Los botones solo-icono necesitan ariaLabel.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <button intButton label="Download" icon="icon icon-download"></button>
  <button intButton label="Next" icon="icon icon-arrow-right" iconPos="right" severity="secondary"></button>
  <button intButton icon="icon icon-filter" ariaLabel="Filters" severity="secondary"></button>
  <button intButton icon="icon icon-edit" ariaLabel="Edit" variant="text" rounded></button>
  <button intButton label="Upload" icon="icon icon-upload" iconPos="top" severity="secondary"></button>
</div>
