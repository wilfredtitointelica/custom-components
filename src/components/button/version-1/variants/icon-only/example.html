<!--
  title: Icon only
  description: variant="text" con icono y sin label: icono sin fondo en caja de 24px (16px small, 32px large), azul en hover (Style Guide .prButton--icon). ariaLabel es obligatorio.
-->
<div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
  <button intButton icon="icon icon-settings" variant="text" size="small" ariaLabel="Settings (small)"></button>
  <button intButton icon="icon icon-settings" variant="text" ariaLabel="Settings"></button>
  <button intButton icon="icon icon-settings" variant="text" size="large" ariaLabel="Settings (large)"></button>
  <button intButton icon="icon icon-settings" variant="text" ariaLabel="Settings (disabled)" disabled></button>
</div>
