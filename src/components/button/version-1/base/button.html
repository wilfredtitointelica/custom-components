<!--
  title: Button
  description: Botón aplicado sobre un <button> o <a> nativo (intButton): teclado, envío de formularios y ARIA se comportan de forma nativa. También como elemento <int-button>, que renderiza el mismo botón nativo por dentro.
  figma: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=18479-7203&m=dev
  figma-frame: https://www.figma.com/design/zwN4YDfH6dTua4nG6bRzaM/Desing-System-Incontrol?node-id=1994-276&m=dev
-->
@if (loading()) {
  <int-icon class="int-button__icon" name="spinner" />
} @else if (icon()) {
  <span class="int-button__icon" [class]="icon()" aria-hidden="true"></span>
}
@if (label()) {
  <span class="int-button__label">{{ label() }}</span>
}
<ng-content />
