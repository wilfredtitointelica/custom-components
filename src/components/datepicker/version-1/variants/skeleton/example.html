<!--
  title: Skeleton
  description: Con `[intSkeleton]` el campo de fecha se muestra como skeleton con el tamaño y el radio de su campo. En modo `inline` todo el calendario es el skeleton.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <int-datepicker dateFormat="dd M, yy" placeholder="dd mm, yyyy" showIcon ariaLabel="Date" [style]="{ width: '20rem' }" [intSkeleton]="loading()" />
  <int-datepicker inline ariaLabel="Calendar" [intSkeleton]="loading()" />
</div>
