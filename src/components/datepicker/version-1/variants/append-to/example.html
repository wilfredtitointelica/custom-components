<!--
  title: Append To
  description: El calendario se monta dentro del componente por defecto (`appendTo="self"`), pero se coloca sobre la pantalla, así que un contenedor con `overflow` no lo recorta (salvo que un ancestro tenga `transform` o `filter`). Su `z-index` es 1000 (el de los overlays) o el que indique `baseZIndex` (aquí `9`, debajo del encabezado fijo de la página, que está en 10). Con `appendTo="body"` o un elemento se monta ahí.
-->
<div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
  <int-datepicker [style]="{ width: '20rem' }" [baseZIndex]="9" showIcon [(ngModel)]="date" />
  <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
</div>
