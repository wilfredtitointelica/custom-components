<!--
  title: Basic
  description: Una fecha con `dateFormat` (tokens `d`, `dd`, `m`, `mm`, `M`, `MM`, `y`, `yy`) y `showIcon`.
-->
<div class="u-display-flex u-flex-column u-gap-sm">
  <int-datepicker [style]="{ width: '20rem' }" [(ngModel)]="date" dateFormat="dd M, yy" placeholder="dd mm, yyyy" showIcon ariaLabel="Date" />
  <p class="u-m-0 u-text-sm">Value: {{ date | json }}</p>
</div>
