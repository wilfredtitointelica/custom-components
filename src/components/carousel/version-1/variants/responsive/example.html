<!--
  title: Responsive
  description: Tres elementos visibles que bajan a dos y a uno según el ancho de la pantalla (responsiveOptions).
-->
<int-carousel [value]="slides" [numVisible]="3" [numScroll]="1" [responsiveOptions]="responsiveOptions" [style]="{ width: '100%' }">
  <ng-template #item let-slide>
    <div class="u-display-flex u-flex-column u-justify-content-center u-align-items-center u-gap-sm u-py-5 u-mx-1 u-radius-md u-background-surface u-color-grey-500" role="img" [attr.aria-label]="slide.title">
      <i class="icon icon-image u-text-5xl" aria-hidden="true"></i>
      <span class="u-text-md">{{ slide.title }}</span>
    </div>
  </ng-template>
</int-carousel>
