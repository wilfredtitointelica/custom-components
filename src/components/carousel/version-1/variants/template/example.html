<!--
  title: Template
  description: Cabecera y pie del carousel con los templates `header` y `footer`; las flechas usan su ícono por defecto.
-->
<int-carousel [value]="slides">
  <ng-template #header>
    <span class="u-text-lg u-bold">Featured reports</span>
  </ng-template>
  <ng-template #item let-slide>
    <div class="u-display-flex u-flex-column u-justify-content-center u-align-items-center u-gap-sm u-py-5 u-mx-1 u-radius-md u-background-surface u-color-grey-500" role="img" [attr.aria-label]="slide.title">
      <i class="icon icon-image icon--lg" aria-hidden="true"></i>
      <span class="u-text-md">{{ slide.title }}</span>
    </div>
  </ng-template>
  <ng-template #footer>
    <span class="u-text-sm u-color-grey-500">Updated every week</span>
  </ng-template>
</int-carousel>
