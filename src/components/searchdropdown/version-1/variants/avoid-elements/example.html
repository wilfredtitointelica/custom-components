<!--
  title: Avoid Elements
  description: Con `avoidElements` el panel de sugerencias no tapa los elementos indicados (selector CSS, variable de template de un elemento HTML o una lista). Al abrirse prueba debajo, arriba y a los lados del campo, y usa la primera posición que cabe en pantalla sin taparlos. Funciona con cualquier `appendTo`. Aquí no tapa el botón "Apply Filters".
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <int-searchdropdown
    placeholder='Search fees, try "serv"'
    ariaLabel="Search fees"
    [avoidElements]="applyFilters"
    [suggestions]="results()"
    [style]="{ width: '29rem' }"
    (completeMethod)="search($event.query)"
  />
  <div class="u-display-flex">
    <div #applyFilters><button intButton label="Apply Filters"></button></div>
  </div>
</div>
