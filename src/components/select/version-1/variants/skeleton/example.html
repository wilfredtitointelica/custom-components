<!--
  title: Skeleton
  description: Con `[intSkeleton]` el select se muestra como skeleton con su tamaño real: cada `size`, `fluid` y la variante `text` conservan su ancho, alto y radio.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-sm">
    <int-select [options]="regions" optionLabel="name" placeholder="Small" size="small" [intSkeleton]="loading()" />
    <int-select [options]="regions" optionLabel="name" placeholder="Normal" [intSkeleton]="loading()" />
    <int-select [options]="regions" optionLabel="name" placeholder="Large" size="large" [intSkeleton]="loading()" />
    <int-select [options]="regions" optionLabel="name" placeholder="Text" variant="text" [intSkeleton]="loading()" />
  </div>
  <int-select [options]="regions" optionLabel="name" placeholder="Fluid" fluid [intSkeleton]="loading()" />
</div>
