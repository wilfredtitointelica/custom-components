<!--
  title: Append To
  description: El panel se monta dentro del componente por defecto (`appendTo="self"`), pero se coloca sobre la pantalla, así que un contenedor con `overflow` no lo recorta (salvo que un ancestro tenga `transform` o `filter`). Su `z-index` es 1000 (el de los overlays) o el que indique `baseZIndex` (aquí `9`, debajo del encabezado fijo de la página, que está en 10). Con `appendTo="body"` o un elemento se monta ahí y comparte su contexto de apilamiento.
-->
<div class="u-display-flex u-flex-wrap u-gap-lg">
  <div class="u-display-flex u-flex-column u-gap-md u-overflow-hidden u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
    <int-select [style]="{ width: '20rem' }" [options]="cities" optionLabel="name" placeholder="appendTo self (default)" [baseZIndex]="9" [(ngModel)]="city" />
    <span class="u-text-sm u-color-grey-500">Contenedor con overflow hidden</span>
  </div>
  <div #container class="u-display-flex u-flex-column u-gap-md u-p-5 u-bt-1 u-be-1 u-bm-1 u-bs-1 u-radius-lg">
    <int-select [style]="{ width: '20rem' }" [options]="cities" optionLabel="name" placeholder="appendTo container" [appendTo]="container" [(ngModel)]="city2" />
    <span class="u-text-sm u-color-grey-500">Panel montado en este contenedor</span>
  </div>
</div>
