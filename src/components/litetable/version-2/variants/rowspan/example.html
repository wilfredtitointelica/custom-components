<!--
  title: Rowspan
  description: El template `body` puede tener más de un `tr` por fila: un `td` con `rowspan="2"` abarca los dos, y el segundo `tr` no lleva esa celda.
-->
<int-litetable showGridlines cellPadding="small" [value]="brands" [style]="{ width: '20rem' }">
  <ng-template #header>
    <tr>
      <th>Brand</th>
      <th>Type</th>
      <th class="u-text-right">Total</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td rowspan="2">{{ item.brand }}</td>
      <td>Issuer</td>
      <td class="u-text-right">{{ item.issuer }}</td>
    </tr>
    <tr>
      <td>Acquirer</td>
      <td class="u-text-right">{{ item.acquirer }}</td>
    </tr>
  </ng-template>
</int-litetable>
