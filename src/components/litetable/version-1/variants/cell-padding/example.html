<!--
  title: Cell Padding
  description: `cellPadding` da espacio interno a cada celda (como `cellpadding`) con `small`, `medium` o `large`. Con `showGridlines` se ve que las celdas siguen juntas y el texto se aleja de su borde.
-->
<div class="u-display-flex u-flex-column u-gap-xl">
  @for (size of sizes; track size) {
    <div class="u-display-flex u-flex-column u-gap-sm">
      <span class="u-text-sm u-bold">{{ size }}</span>
      <int-litetable showGridlines [cellPadding]="size" [value]="rows" [style]="{ width: '20rem' }">
        <ng-template #header>
          <tr>
            <th>Category</th>
            <th>Transactions</th>
            <th>Total</th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td>{{ row.category }}</td>
            <td>{{ row.transactions }}</td>
            <td>{{ row.total }}</td>
          </tr>
        </ng-template>
      </int-litetable>
    </div>
  }
</div>
