<!--
  title: Colspan
  description: Una fila combina celdas hacia la derecha con `spans`: `{ category: { colspan: 2 } }` hace que la celda de `category` abarque dos columnas, como una fila de total.
-->
<int-litetable showGridlines cellPadding="small" [value]="rows" [columns]="columns" [style]="{ width: '20rem' }" />
