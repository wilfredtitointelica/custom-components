<!--
  title: Full First Column
  description: Con `fullFirstColumn`, la primera columna ocupa todo el ancho disponible y lleva los valores al borde derecho; pensado para tooltips y popovers.
-->
<int-litetable fullFirstColumn [value]="rows" [style]="{ width: '20rem' }">
  <ng-template #header>
    <tr>
      <th>January 25</th>
      <th class="u-text-right">60K</th>
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      <td>{{ row.label }}</td>
      <td class="u-text-right">{{ row.value }}</td>
    </tr>
  </ng-template>
</int-litetable>
