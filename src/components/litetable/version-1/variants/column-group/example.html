<!--
  title: Column Group
  description: `columnGroups` agrega una fila de cabecera encima de la de `columns`: cada grupo abarca `colspan` columnas, y con `rowspan: 2` una columna sin grupo ocupa las dos filas de cabecera.
-->
<int-litetable showGridlines cellPadding="small" [value]="rows" [columns]="columns" [columnGroups]="columnGroups" [style]="{ width: '24rem' }" />
