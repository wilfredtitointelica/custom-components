<!--
  title: Rowspan
  description: Una fila combina celdas hacia abajo con `spans`: `{ brand: { rowspan: 2 } }` hace que la celda de `brand` abarque dos filas; las filas cubiertas no necesitan ese campo.
-->
<int-litetable showGridlines cellPadding="small" [value]="rows" [columns]="columns" [style]="{ width: '20rem' }" />
