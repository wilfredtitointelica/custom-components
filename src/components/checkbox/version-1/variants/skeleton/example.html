<!--
  title: Skeleton
  description: Con `[intSkeleton]` la casilla se muestra como skeleton con su tamaño y radio reales en cada `size`. La etiqueta es otro elemento: también lleva `[intSkeleton]` y se convierte en una barra del largo de su texto.
-->
<div class="u-display-flex u-flex-column u-gap-md">
  <div>
    <button intButton [label]="loading() ? 'Show content' : 'Show skeleton'" variant="outlined" size="small" (click)="loading.set(!loading())"></button>
  </div>
  <div class="u-display-flex u-flex-wrap u-align-items-center u-gap-lg">
    <div class="u-display-flex u-align-items-center u-gap-xs">
      <int-checkbox inputId="sk-cb-small" size="small" binary [intSkeleton]="loading()" />
      <label for="sk-cb-small" [intSkeleton]="loading()">Small</label>
    </div>
    <div class="u-display-flex u-align-items-center u-gap-xs">
      <int-checkbox inputId="sk-cb-normal" binary [intSkeleton]="loading()" />
      <label for="sk-cb-normal" [intSkeleton]="loading()">Normal</label>
    </div>
    <div class="u-display-flex u-align-items-center u-gap-xs">
      <int-checkbox inputId="sk-cb-large" size="large" binary [intSkeleton]="loading()" />
      <label for="sk-cb-large" [intSkeleton]="loading()">Large</label>
    </div>
  </div>
</div>
