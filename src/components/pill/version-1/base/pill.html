<!--
  title: Pill
  description: Etiqueta corta de estado basada en los tokens de badge del Style Guide (--i-badge-*).
-->
@if (icon()) {
  <span class="int-pill__icon" [class]="icon()" aria-hidden="true"></span>
}
@if (value() !== null && value() !== undefined) {
  <span class="int-pill__label">{{ value() }}</span>
}
<ng-content />
